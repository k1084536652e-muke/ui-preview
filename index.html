<script>
/* 尽早应用主题，避免闪烁。明文键 calc-theme：night / day / system */
(function(){try{var p=localStorage.getItem("calc-theme")||"night";var t=p==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"night":"day"):p;document.documentElement.setAttribute("data-theme",t==="day"?"day":"night");}catch(e){}})();
</script>
<style>
:root{
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px); --safe-right:env(safe-area-inset-right,0px);
  --nav-h:44px; --tab-h:52px; --r-tile:3px;
}
[data-theme=night]{
  color-scheme:dark; --sb:rgba(255,255,255,.28);
  --bg:#000000; --bar:rgba(10,10,10,.86); --surface:#1c1c1e; --surface-2:#2c2c2e;
  --text:#ffffff; --muted:#8e8e93; --faint:#636366; --sep:rgba(255,255,255,.12);
  --accent:#ffffff; --accent-ink:#000000; --danger:#ff453a; --icon:#ffffff;
  --doc-bg:#1c1c1e; --doc-line:#3a3a3c; --scrim:rgba(0,0,0,.55); --sheet:#1c1c1e;
  --seg-bg:#1c1c1e; --seg-on:#48484a; --field:#1c1c1e; --ring:rgba(0,0,0,.45);
  --group:#1c1c1e; --page:#000000;
  --fs-sheet:#1c1c1e; --fs-grp:#2c2c2e;
  --n-red:#ff453a; --n-orange:#ff9f0a; --n-green:#30d158; --n-blue:#0a84ff; --n-grey:#98989d;
}
[data-theme=day]{
  color-scheme:light; --sb:rgba(0,0,0,.25);
  --bg:#ffffff; --bar:rgba(255,255,255,.88); --surface:#f2f2f7; --surface-2:#e5e5ea;
  --text:#000000; --muted:#8e8e93; --faint:#aeaeb2; --sep:rgba(0,0,0,.12);
  --accent:#000000; --accent-ink:#ffffff; --danger:#ff3b30; --icon:#000000;
  --doc-bg:#f2f2f7; --doc-line:#d1d1d6; --scrim:rgba(0,0,0,.25); --sheet:#ffffff;
  --seg-bg:#e5e5ea; --seg-on:#ffffff; --field:#f2f2f7; --ring:rgba(255,255,255,.7);
  --group:#f2f2f7; --page:#ffffff;
  --fs-sheet:#ffffff; --fs-grp:#f2f2f7;
  --n-red:#ff3b30; --n-orange:#ff9500; --n-green:#34c759; --n-blue:#007aff; --n-grey:#8e8e93;
}
*{box-sizing:border-box;margin:0;padding:0}
/* 全局禁止文本选择 / iOS 长按菜单（计算器与相册均适用）；输入框、文本域、可编辑区域恢复 */
body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable],[contenteditable] *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
::-webkit-scrollbar{width:4px;height:4px;background:transparent}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb);border-radius:2px}
::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}}
html,body{height:100%;height:100dvh;max-height:100dvh;background:var(--bg);overflow:hidden}
body{color:var(--text);overflow:hidden;
  font-family:-apple-system,"SF Pro Text","PingFang SC","Noto Sans CJK SC","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block;flex:0 0 auto}
.view{position:fixed;inset:0;width:100%;height:100%;height:100dvh;max-height:100dvh;background:var(--page);overflow:hidden;display:flex;flex-direction:column}
.nav{position:relative;flex:0 0 auto;padding-top:var(--safe-top);padding-left:var(--safe-left);padding-right:var(--safe-right);background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);z-index:20;border-bottom:.5px solid var(--sep)}
.nav-row{height:var(--nav-h);display:flex;align-items:center;padding:0 8px 0 16px}
.nav-title{flex:1;display:flex;align-items:baseline;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.nav-title b{font-size:17px;font-weight:650;letter-spacing:-.2px}
.nav-title small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;display:grid;place-items:center;color:var(--icon);border-radius:20px;flex:0 0 auto}
.ibtn.on{color:var(--accent)}
.txtbtn{font-size:16px;color:var(--text);font-weight:500;padding:0 8px;height:40px;display:flex;align-items:center;white-space:nowrap}
.nav-row.three{display:grid;grid-template-columns:96px 1fr 96px;padding:0 8px}
.nav-row.three .mid{text-align:center;font-size:17px;font-weight:650;white-space:nowrap}
.nav-row.three .r{justify-self:end}
.back{display:flex;align-items:center;color:var(--text);font-size:16px;height:40px}
.back svg.i{width:24px;height:24px;margin-right:-2px}
.search-wrap{padding:2px 16px 10px;display:flex;flex-direction:column;gap:8px}
.field{height:36px;border-radius:10px;background:var(--field);display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;color:var(--muted)}
.field svg.i{width:17px;height:17px}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--text);-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--muted)}
.field input::-webkit-search-cancel-button{display:none}
.clr{width:26px;height:26px;display:grid;place-items:center;opacity:0;transform:scale(.7);pointer-events:none;transition:opacity .15s ease,transform .15s ease}
.clr.show{opacity:1;transform:none;pointer-events:auto}
mark.hl{background:none;color:var(--danger);font-weight:650}
.clr span{width:18px;height:18px;border-radius:9px;background:var(--faint);display:grid;place-items:center;color:var(--surface)}
.clr svg.i{width:12px;height:12px;stroke-width:2.5}
.seg{height:30px;border-radius:9px;background:var(--seg-bg);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:2px;gap:2px}
.seg button{display:grid;place-items:center;font-size:13px;color:var(--muted);border-radius:7px;font-weight:500}
.seg button.on{background:var(--seg-on);color:var(--text);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.scroll{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-top:6px;padding-bottom:12px;
  padding-left:var(--safe-left);padding-right:var(--safe-right)}
.scroll.searching{padding-top:6px}
.scroll.notab{padding-bottom:24px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.sec h3{font-size:13px;font-weight:650;color:var(--muted);letter-spacing:.2px}
.sec button{font-size:13px;color:var(--text);display:flex;align-items:center;gap:1px}
.sec button svg.i{width:15px;height:15px}
.folders{display:flex;gap:10px;padding:0 16px 6px;overflow-x:auto;scrollbar-width:none}
.folders::-webkit-scrollbar{display:none}
.fcard{flex:0 0 104px;text-align:left;display:block;min-width:0}
.fcover{width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:1.5px;background:var(--surface)}
.fcover>div:first-child{grid-row:1/3}
.fcover>div{background-size:cover;background-position:center}
.fcover.empty{place-items:center;color:var(--faint);grid-template-columns:1fr;grid-template-rows:1fr}
.fcover.empty>div:first-child{grid-row:auto}
.fname{font-size:13px;font-weight:550;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcount{font-size:11px;color:var(--muted);margin-top:1px}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 12px;padding:4px 16px}
.fgrid .fcard{flex:none}
.fgrid .fcover{border-radius:12px}
.fgrid .fname{font-size:14px}
.fgrid .fcount{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0 2px}
.grid.names{row-gap:6px}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}.fgrid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(6,1fr)}.fgrid{grid-template-columns:repeat(5,1fr)}}
.cell{display:block;text-align:left;min-width:0}
.tile{position:relative;aspect-ratio:1;border-radius:var(--r-tile);overflow:hidden;background:var(--surface);background-size:cover;background-position:center}
.tile .dur{position:absolute;right:5px;bottom:4px;display:flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);font-variant-numeric:tabular-nums;z-index:1}
.tile .dur svg{width:9px;height:9px;fill:#fff}
.tile.video::before{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(transparent,rgba(0,0,0,.28))}
.doc{background:var(--doc-bg);padding:10px 9px;display:flex;flex-direction:column;gap:5px;border:.5px solid var(--sep)}
.doc .dt{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .dl{height:4px;border-radius:2px;background:var(--doc-line)}
.doc .dic{position:absolute;right:7px;bottom:6px;color:var(--faint)}
.doc .dic svg.i{width:15px;height:15px}
.tname{font-size:11px;color:var(--muted);padding:4px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2}
.cell.sel .tile::after{box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 4px var(--ring)}
.mark{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:11px;border:1.5px solid rgba(255,255,255,.92);z-index:3;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3);background:rgba(0,0,0,.18)}
.doc .mark{border-color:var(--faint);background:transparent}
.cell.sel .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 1px var(--ring),0 1px 3px rgba(0,0,0,.3)}
.mark svg.i{width:14px;height:14px;stroke-width:3}
.empty-note{padding:48px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.tabbar{position:relative;flex:0 0 auto;height:calc(var(--tab-h) + var(--safe-bottom));padding:0 var(--safe-right) var(--safe-bottom) var(--safe-left);
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:3px;color:var(--muted);font-size:10px;font-weight:550;position:relative}
.tab svg.i{width:24px;height:24px}
.tab.on{color:var(--text)}
.tab:disabled{opacity:.35;cursor:default}
.actionbar .tab{color:var(--icon)}
.actionbar .tab.danger{color:var(--danger)}
.badge{position:absolute;top:3px;left:50%;margin-left:7px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
/* 「＋」：38px（原 46px），颜色逻辑同其它 Tab：平时灰色，菜单打开/按下时为文字色 */
.fab{width:38px;height:38px;border-radius:19px;background:var(--muted);color:var(--bg);display:grid;place-items:center;margin-top:1px;transition:background .2s ease,color .2s ease,border-color .2s ease}
.fab svg.i{width:22px;height:22px;stroke-width:2.2;transition:transform .2s ease}
.fab.open svg.i{transform:rotate(45deg)}
.fab.open,.tab:active .fab{background:var(--text)}
[data-theme=day] .fab{background:#fff;color:var(--muted);border:2px solid currentColor}
[data-theme=day] .fab.open,[data-theme=day] .tab:active .fab{background:#fff;color:#000}
#a-overlay{position:absolute;inset:0;pointer-events:none;z-index:15}
#a-overlay.is-open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s ease}
#a-overlay.is-open .scrim{opacity:1}
#a-overlay.closing .scrim{transition-duration:.15s}
.pop{position:absolute;left:50%;bottom:calc(var(--tab-h) + var(--safe-bottom) + 10px);width:236px;background:var(--sheet);border-radius:14px;z-index:25;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35);
  transform-origin:bottom center;opacity:0;transform:translateX(-50%) translateY(8px) scale(.85);
  transition:opacity .22s cubic-bezier(.2,.9,.3,1.2),transform .22s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
#a-overlay.is-open .pop{opacity:1;transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto}
#a-overlay.closing .pop{transition-duration:.15s;transition-timing-function:ease}
.pop button{width:100%;height:50px;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:16px;border-bottom:.5px solid var(--sep);text-align:left;
  opacity:0;transform:translateY(6px);transition:opacity .2s ease,transform .2s ease}
.pop button:last-child{border:0}
#a-overlay.is-open .pop button{opacity:1;transform:translateY(0)}
#a-overlay.is-open .pop button:nth-child(1){transition-delay:30ms}
#a-overlay.is-open .pop button:nth-child(2){transition-delay:60ms}
#a-overlay.is-open .pop button:nth-child(3){transition-delay:90ms}
#a-overlay.closing .pop button{transition-duration:.12s;transition-delay:0ms!important}
.tacts{display:flex;align-items:center;gap:0;flex:0 0 auto;margin-left:auto}
.tacts .txtbtn{padding:0 6px;font-size:14px;height:36px}
.txtbtn.danger{color:var(--danger);font-weight:550}
@media (prefers-reduced-motion:reduce){
  .fab svg.i,.scrim,.pop,.pop button{transition:none!important}
}
.page{padding:8px 16px 0;max-width:720px;margin:0 auto}
.gh{font-size:13px;color:var(--muted);padding:18px 16px 7px;letter-spacing:.2px}
.group{background:var(--group);border-radius:12px;overflow:hidden}
.row{min-height:46px;display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;font-size:16px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .v{margin-left:auto;color:var(--muted);display:flex;align-items:center;gap:2px;font-size:16px;white-space:nowrap}
.row .v svg.i{width:18px;height:18px;color:var(--faint)}
.row.segrow{padding:8px}
.row.segrow .seg{flex:1;height:34px}
.row.segrow .seg button{font-size:14px}
.gf{font-size:12px;color:var(--muted);padding:7px 16px 0;line-height:1.45}
.toggle{margin-left:auto;width:51px;height:31px;border-radius:16px;background:var(--surface-2);position:relative;transition:background .2s;flex:0 0 auto}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
[data-theme=night] .toggle{background:#39393d}
.toggle.on{background:var(--text)!important}
.toggle.on::after{transform:translateX(20px);background:var(--bg)}
.trow{min-height:62px;padding-right:4px}
.tthumb{width:44px;height:44px;border-radius:6px;background:var(--surface-2);background-size:cover;background-position:center;flex:0 0 auto;display:grid;place-items:center;color:var(--faint)}
.tthumb svg.i{width:20px;height:20px}
.tmeta{min-width:0;flex:1}
.tmeta b{display:block;font-size:15px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tdays{font-size:12px;color:var(--muted);white-space:nowrap}
.calc{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:12px calc(var(--safe-right) + 16px) calc(var(--safe-bottom) + 24px) calc(var(--safe-left) + 16px)}
.calc-inner{max-width:560px;margin:0 auto}
.calc .seg{height:34px;margin:0 0 14px}
.calc .seg button{font-size:14px}
.chead{display:flex;align-items:flex-end;justify-content:space-between;padding:4px 4px 10px}
.chead small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px;letter-spacing:.3px}
.chead b{font-size:22px;font-weight:700;letter-spacing:-.3px}
.pill{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--sep);border-radius:11px;padding:3px 9px;margin-bottom:4px;white-space:nowrap}
.frow{min-height:50px;cursor:text}
.frow .lab{flex:0 0 auto;font-size:16px}
.frow input{flex:1;min-width:0;border:0;outline:0;background:transparent;text-align:right;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.frow input::placeholder{color:var(--faint);font-weight:400;font-size:16px}
.frow .unit{font-size:14px;color:var(--muted);font-weight:500;min-width:14px;text-align:right}
.frow.err .lab{color:var(--danger)}
.ferr{font-size:12px;color:var(--danger);padding:6px 4px 0}
.clab{font-size:13px;color:var(--muted);padding:16px 4px 7px}
.cta{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:13px;margin:18px 0 0;font-size:17px;font-weight:650;letter-spacing:1px;background:var(--text);color:var(--bg)}
.cta:active{opacity:.8}
[data-theme=day] .cta{background:#fff;color:#000;border:2px solid #000}
.res{margin-top:18px;background:var(--group);border-radius:14px;padding:14px 16px 4px}
.res .rh small{font-size:12px;color:var(--muted)}
.res .rh b{display:block;font-size:17px;font-weight:650;margin-top:1px}
.res .sum{font-size:12px;color:var(--muted);margin:8px 0 6px}
.res .big{padding:6px 0 12px;border-bottom:.5px solid var(--sep)}
.res .big span{font-size:13px;color:var(--muted)}

.res .big>div span{font-size:inherit;color:var(--text)}
.res .big i{font-style:normal;font-size:15px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}

.res .kv>span{color:var(--muted);white-space:nowrap}
.res .kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.res .kv b i{font-style:normal;color:var(--muted);font-weight:500;font-size:13px;margin-left:3px}
.res .note{font-size:11px;color:var(--muted);line-height:1.45;padding:2px 0 12px}
.disc{font-size:11px;color:var(--muted);text-align:center;padding:16px 8px 0;line-height:1.5}
.viewer{position:fixed;inset:0;background:#000;z-index:40}
.viewer .img{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;background-position:center}
.viewer .vbar{position:absolute;top:0;left:0;right:0;padding:calc(var(--safe-top) + 6px) 12px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.viewer .vbar b{font-size:15px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer .vbtn{height:36px;padding:0 12px;border-radius:18px;background:rgba(40,40,42,.7);color:#fff;font-size:14px;display:flex;align-items:center;gap:2px;flex:0 0 auto}
.viewer .vbtn svg.i{width:20px;height:20px}
/* 统一对话框：标题 + 可选灰字说明 + 可选输入框 + 行内错误 + 两个按钮（右侧为主操作，危险操作为红色） */

<!-- ========== 计算器（解锁前的伪装页） ========== -->
<section class="view" id="v-calc" aria-label="房贷计算器">
  <header class="nav"><div class="nav-row three">
    <span></span><div class="mid" id="calc-title">房贷计算</div>
    <span class="r"></span>
  </div></header>
  <main class="calc"><div class="calc-inner">
    <div class="seg" role="tablist" id="calc-mode">
      <button type="button" class="on" data-mode="mortgage">房贷计算</button>
      <button type="button" data-mode="tax">个税计算</button>
    </div>

    <form id="mortgage-form" novalidate autocomplete="off">
      <div class="chead"><div><small>商业贷款</small><b>月供估算</b></div><span class="pill">LPR 参考 3.10%</span></div>
      <div class="group">
        <label class="row frow" id="fr-amount"><span class="lab">贷款金额</span><input id="loan-amount" inputmode="decimal" placeholder="请输入金额" enterkeyhint="done"><span class="unit">元</span></label>
        <label class="row frow" id="fr-years"><span class="lab">贷款年限</span><input id="loan-years" inputmode="numeric" value="30"><span class="unit">年</span></label>
        <label class="row frow" id="fr-rate"><span class="lab">年利率</span><input id="loan-rate" inputmode="decimal" value="3.10"><span class="unit">%</span></label>
      </div>
      <div class="ferr" id="mortgage-error" hidden></div>
      <div class="clab">还款方式</div>
      <div class="seg" id="repayment">
        <button type="button" class="on" data-rep="equal-payment">等额本息</button>
        <button type="button" data-rep="equal-principal">等额本金</button>
      </div>
      <button type="submit" class="cta" id="mortgage-submit">计算</button>
      <div class="res" id="mortgage-result" hidden></div>
    </form>

    <form id="tax-form" novalidate autocomplete="off" hidden>
      <div class="chead"><div><small>综合所得 · 月度</small><b>个税估算</b></div><span class="pill">起征点 5,000</span></div>
      <div class="group">
        <label class="row frow" id="fr-income"><span class="lab">税前月收入</span><input id="tax-income" inputmode="decimal" placeholder="请输入金额"><span class="unit">元</span></label>
        <label class="row frow"><span class="lab">五险一金</span><input id="tax-insurance" inputmode="decimal" value="0"><span class="unit">元</span></label>
        <label class="row frow"><span class="lab">专项附加扣除</span><input id="tax-deduction" inputmode="decimal" value="0"><span class="unit">元</span></label>
      </div>
      <div class="ferr" id="tax-error" hidden></div>
      <button type="submit" class="cta" id="tax-submit">计算</button>
      <div class="res" id="tax-result" hidden></div>
    </form>

    <p class="disc">计算结果仅供参考，实际以贷款机构及税务机关核定为准。</p>
  </div></main>
</section>

<!-- ========== 后台（相册） ========== -->
<section class="view" id="v-album" aria-label="相册" hidden>
  <header class="nav" id="a-nav"></header>
  <!-- 网格 / 列表内容区。正式应用的分页 / 增量加载（首屏约 20 项、IntersectionObserver 哨兵、缩略图懒解密与缓存）见 DESIGN-NOTES.md「18. Paged / incremental loading」。 -->

  <div class="selbar" id="a-sel" hidden></div>
  <div id="a-overlay"></div>
  <nav class="tabbar" id="a-bar"></nav>
</section>

const ic = (n, cls="") => `<svg class="i ${cls}" viewBox="0 0 24 24">${I[n]}</svg>`;

// deterministic placeholder "photos" as SVG data URIs
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const palettes=[
 ["#f6c28b","#e98a6c","#5b6c8f","#2e3a55","#1f2a3a"],
 ["#a8d8f0","#d9eef7","#6c9a5b","#3f6b3a","#2b4a2a"],
 ["#ffd9a0","#ff9f6b","#8a5a7a","#47375a","#2a2140"],
 ["#cfe3ea","#9cc3d1","#7b8f9a","#4f6170","#2f3c48"],
 ["#fbe3c4","#f1b98a","#c98a5a","#8a5a3a","#4a3020"],
 ["#b9e0d2","#7cc4b0","#3f8f7f","#2a6358","#18403a"],
 ["#e8d5f2","#c3a6dd","#7f6aa8","#4d4378","#2b2648"],
 ["#dfe8f1","#b7c9db","#8aa1b8","#5d7590","#2f4157"],
];
function photo(seed,kind){
  const r=rng(seed*9301+49297), p=palettes[seed%palettes.length];
  const uid='p'+seed+kind;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${uid}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p[1]}"/><stop offset="1" stop-color="${p[0]}"/></linearGradient><radialGradient id="${uid}g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>`;
  if(kind==="macro"){
    s+=`<rect width="100" height="100" fill="${p[3]}"/>`;
    for(let k=0;k<5;k++){const cx=r()*100,cy=r()*100,rr=18+r()*30;s+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="${p[k%3]}" opacity="${.35+r()*.4}"/>`}
    s+=`<rect width="100" height="100" fill="url(#${uid}g)" opacity=".15"/>`;
  } else if(kind==="city"){
    s+=`<rect width="100" height="100" fill="url(#${uid}s)"/>`;
    let x=0;while(x<100){const w=8+r()*14,h=25+r()*45;s+=`<rect x="${x}" y="${100-h}" width="${w}" height="${h}" fill="${p[3+(r()>.5?1:0)]}"/>`;
      for(let yy=100-h+5;yy<96;yy+=7)for(let xx=x+2;xx<x+w-3;xx+=5) if(r()>.55) s+=`<rect x="${xx}" y="${yy}" width="2" height="3" fill="${p[0]}" opacity=".8"/>`;
      x+=w+1;}
  } else {
    const hz=45+r()*20;
    s+=`<rect width="100" height="100" fill="url(#${uid}s)"/>`;
    s+=`<circle cx="${20+r()*60}" cy="${hz-12-r()*15}" r="${6+r()*6}" fill="#fff" opacity=".75"/>`;
    const ridge=(base,amp,col,op)=>{let d=`M0 100 L0 ${base}`;for(let x=0;x<=100;x+=10)d+=` L${x} ${base-r()*amp}`;d+=` L100 100Z`;return `<path d="${d}" fill="${col}" opacity="${op}"/>`};
    s+=ridge(hz,18,p[2],.9)+ridge(hz+12,14,p[3],1)+ridge(hz+26,8,p[4],1);
  }
  s+=`</svg>`;
  /* base64 + single-quoted url() — avoids breaking style="..." and works in iOS Safari */
  const b64=btoa(unescape(encodeURIComponent(s)));
  return `url('data:image/svg+xml;base64,${b64}')`;
}

/* ========== 财务计算（移植自 calc-vault/js/finance.js） ========== */
const MAX_AMOUNT_INTEGER_DIGITS=9, MAX_AMOUNT_DECIMAL_DIGITS=2;
const MONEY_FORMATTER=new Intl.NumberFormat("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:true});
const TAX_BRACKETS=[
  {limit:3000,rate:.03,deduction:0},{limit:12000,rate:.1,deduction:210},
  {limit:25000,rate:.2,deduction:1410},{limit:35000,rate:.25,deduction:2660},
  {limit:55000,rate:.3,deduction:4410},{limit:80000,rate:.35,deduction:7160},
  {limit:Number.POSITIVE_INFINITY,rate:.45,deduction:15160},
];
function roundMoney(v){return Math.round((v+Number.EPSILON)*100)/100}
function validDecimalText(v){return /^(?:0|[1-9]\d{0,8})(?:\.\d{1,2})?$/.test(v)}
function sanitizeDecimal(value){
  const cleaned=value.replace(/[^\d.]/g,"");
  const [integerPart="",...decimalParts]=cleaned.split(".");
  const integer=integerPart.slice(0,MAX_AMOUNT_INTEGER_DIGITS);
  if(decimalParts.length===0) return integer;
  return `${integer}.${decimalParts.join("").slice(0,MAX_AMOUNT_DECIMAL_DIGITS)}`;
}
function parseAmount(value){
  const normalized=value.trim();
  if(!validDecimalText(normalized)) return null;
  const amount=Number(normalized);
  return Number.isFinite(amount)?amount:null;
}
function fmt(v){return Number.isFinite(v)?MONEY_FORMATTER.format(roundMoney(Math.max(0,v))):"—"}
function calculateMortgage({principalYuan,years,annualRatePercent,repayment}){
  const months=Math.round(years*12);
  if(!Number.isFinite(principalYuan)||principalYuan<=0||!Number.isFinite(months)||months<=0||!Number.isFinite(annualRatePercent)||annualRatePercent<0)
    throw new RangeError("贷款参数无效");
  const monthlyRate=annualRatePercent/100/12;
  const basePrincipalPayment=principalYuan/months;
  let firstPayment, monthlyDecrease=0, totalInterest, totalPayment;
  if(repayment==="equal-principal"){
    firstPayment=basePrincipalPayment+principalYuan*monthlyRate;
    monthlyDecrease=basePrincipalPayment*monthlyRate;
    totalInterest=principalYuan*monthlyRate*((months+1)/2);
    totalPayment=principalYuan+totalInterest;
  } else {
    if(monthlyRate===0) firstPayment=basePrincipalPayment;
    else {const factor=(1+monthlyRate)**months; firstPayment=(principalYuan*monthlyRate*factor)/(factor-1);}
    totalPayment=firstPayment*months;
    totalInterest=totalPayment-principalYuan;
  }
  if(![firstPayment,monthlyDecrease,totalInterest,totalPayment].every(Number.isFinite))
    throw new RangeError("贷款结果超出可计算范围");
  return {months,firstPayment:roundMoney(firstPayment),monthlyDecrease:roundMoney(monthlyDecrease),totalInterest:roundMoney(totalInterest),totalPayment:roundMoney(totalPayment)};
}
function calculateIncomeTax({monthlyIncome,socialInsurance,specialDeduction}){
  if(![monthlyIncome,socialInsurance,specialDeduction].every(Number.isFinite)||monthlyIncome<0||socialInsurance<0||specialDeduction<0)
    throw new RangeError("收入参数无效");
  const taxableIncome=Math.max(0,monthlyIncome-socialInsurance-specialDeduction-5000);
  const bracket=TAX_BRACKETS.find(item=>taxableIncome<=item.limit)||TAX_BRACKETS[TAX_BRACKETS.length-1];
  const tax=taxableIncome*bracket.rate-bracket.deduction;
  const payableTax=roundMoney(Math.max(0,tax));
  const afterTaxIncome=roundMoney(Math.max(0,monthlyIncome-socialInsurance-payableTax));
  return {taxableIncome:roundMoney(taxableIncome),payableTax,afterTaxIncome};
}

function applyTheme(pref){
  S.themePref=pref||"night";
  try{localStorage.setItem("calc-theme",S.themePref)}catch(e){}
  let t=S.themePref;
  if(t==="system") t=matchMedia("(prefers-color-scheme: dark)").matches?"night":"day";
  document.documentElement.setAttribute("data-theme", t==="day"?"day":"night");
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = t==="day"?"#ffffff":"#000000";
}

function toast(msg){
  const layer=document.getElementById("layer");
  const el=document.createElement("div");
  layer.querySelectorAll(".toast").forEach(x=>x.remove());
  el.className="toast"; el.textContent=msg;
  layer.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("show")));
  setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=>el.remove(),220); },2000);
}

/* 搜索时把匹配字符标红；转义后再包 <mark> */
function hl(name){
  const q=S.search?S.q.trim():"";
  if(!q) return esc(name);
  const i=name.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(name);
  return esc(name.slice(0,i))+`<mark class="hl">${esc(name.slice(i,i+q.length))}</mark>`+esc(name.slice(i+q.length));
}
const showNames=()=>S.showNames||(S.search&&!!S.q.trim());

}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* 长按约 450ms 进入原地多选，并选中该项（触摸与鼠标） */
const LP={timer:0,x:0,y:0,suppress:false};
function lpKey(el){
  const ctx=curCtx();
  if(el.dataset.id&&(ctx==="photos"||ctx==="folder")) return el.dataset.id;
  if(el.dataset.folder&&ctx==="folders") return el.dataset.folder;
  if(el.dataset.tid&&ctx==="trash") return el.dataset.tid;
  return null;
}
function bindLongPress(root){
  const cancel=()=>{ clearTimeout(LP.timer); LP.timer=0; };
  root.onpointerdown=function(e){
    if(S.select||e.button>0) return;
    const el=e.target.closest("[data-id],[data-folder],[data-tid]"); if(!el) return;
    const key=lpKey(el); if(!key) return;
    LP.x=e.clientX; LP.y=e.clientY; cancel();
    LP.timer=setTimeout(()=>{
      LP.timer=0; LP.suppress=true;
      try{ navigator.vibrate&&navigator.vibrate(8); }catch(_){}
      S.select=true; S.sel=new Set([key]); S.plus=false; render();
      const sel=`[data-id="${key}"],[data-folder="${key}"],[data-tid="${key}"]`;
      const n=document.querySelector("#a-body "+sel.split(",").join(",#a-body "));
      if(n&&!matchMedia("(prefers-reduced-motion: reduce)").matches) n.animate([{transform:"scale(1)"},{transform:"scale(.93)"},{transform:"scale(1)"}],{duration:220,easing:"ease-out"});
      setTimeout(()=>{ LP.suppress=false; },600);
    },450);
  };
  root.onpointermove=function(e){ if(LP.timer&&Math.hypot(e.clientX-LP.x,e.clientY-LP.y)>10) cancel(); };
  root.onpointerup=root.onpointercancel=root.onpointerleave=cancel;
  document.getElementById("a-body").onscroll=cancel;
  root.oncontextmenu=function(e){ if(e.target.closest(".cell,.fcard,.trow")) e.preventDefault(); };
}
function resetModes(){ S.search=false; S.searchAnim=false; S.q=""; S.filter="all"; S.select=false; S.sel=new Set(); }
function toggleSel(id){ if(S.sel.has(id)) S.sel.delete(id); else S.sel.add(id); render(); }
function retLabel(k){ return k==="never"?"永不自动删除":k+" 天"; }
/* FLIP：只用 transform / opacity；只动画视口内及附近的元素 */
const FLIP_SEL="[data-flip],[data-id],[data-folder],[data-tid]";
const flipKey=el=>el.dataset.flip||el.dataset.id||el.dataset.folder||el.dataset.tid;
function flipEls(body){ return [...body.querySelectorAll(FLIP_SEL)].filter(el=>{ if(el.closest(".flip-ghost")) return false; const a=el.parentElement.closest(FLIP_SEL); return !(a&&body.contains(a)); }); }
function refreshBody(){
  /* 只刷新内容区与筛选高亮，保留输入框焦点与展开状态 */
  const body=document.getElementById("a-body");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const br=body.getBoundingClientRect();
  const near=r=>r.bottom>br.top-120&&r.top<br.bottom+120;
  const before=new Map();
  if(!reduce) flipEls(body).forEach(el=>{ if(el.classList.contains("flip-ghost")) return; const r=el.getBoundingClientRect(); if(near(r)) before.set(flipKey(el),{el,r}); });
  body.innerHTML=buildBody(curCtx());
  if(!reduce){
    const seen=new Set();
    flipEls(body).forEach(el=>{
      const k=flipKey(el), o=before.get(k);
      if(o) seen.add(k);
      const r=el.getBoundingClientRect();
      if(!near(r)&&!(o&&near(o.r))) return;
      if(o){
        const dx=o.r.left-r.left, dy=o.r.top-r.top;
        if(dx||dy) el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"none"}],{duration:250,easing:"cubic-bezier(.2,.8,.2,1)",delay:40,fill:"backwards"});
      } else {
        el.animate([{opacity:0,transform:"scale(.85)"},{opacity:1,transform:"none"}],{duration:220,easing:"cubic-bezier(.2,.8,.2,1)",delay:60,fill:"backwards"});
      }
    });
    const br2=body.getBoundingClientRect();
    before.forEach((o,k)=>{
      if(seen.has(k)) return;
      const g=o.el.cloneNode(true); g.classList.add("flip-ghost");
      [g,...g.querySelectorAll(FLIP_SEL)].forEach(n=>["flip","id","folder","tid"].forEach(a=>n.removeAttribute("data-"+a)));
      Object.assign(g.style,{position:"absolute",left:(o.r.left-br2.left+body.scrollLeft)+"px",top:(o.r.top-br2.top+body.scrollTop)+"px",width:o.r.width+"px",height:o.r.height+"px",margin:"0",pointerEvents:"none",zIndex:"-1"});
      body.appendChild(g);
      g.animate([{opacity:1,transform:"none"},{opacity:0,transform:"scale(.85)"}],{duration:180,easing:"ease-in",fill:"forwards"}).onfinish=()=>g.remove();
    });
  }
  document.querySelectorAll("#sbox [data-filter]").forEach(b=>b.classList.toggle("on",b.dataset.filter===S.filter));
  document.querySelectorAll("#sbox [data-sort]").forEach(b=>b.classList.toggle("on",b.dataset.sort===S.sort));
}

}

  if(ctx==="settings") return "";

function fcardHTML(f, selecting){

  const mark=selecting?`<span class="mark">${sel?ic("tick"):""}</span>`:"";
  return `<button type="button" class="fcard${sel?" sel":""}" data-folder="${f.id}"><div class="fwrap">${folderCover(f)}${mark}</div><div class="fname">${hl(f.n)}</div><div class="fcount">${f.c} 项</div></button>`;

/* 原型一次性渲染全部演示项；正式应用按 DESIGN-NOTES §18 分批解密 / 渲染（每批约 20 项，哨兵触发下一批）。 */
function buildBody(ctx){
  const names=showNames()?"names":"";
  const empty=`<div class="empty-note">没有匹配的项目</div>`;
  if(ctx==="photos"){
    let html="";
    /* 文件夹横条也参与搜索：每个文件夹单独做 FLIP（横条容器不设 data-flip） */
    const fl=(S.filter==="all"||S.filter==="folder")?FOLDERS.filter(f=>matchQ(f.n)):[];
    const list=filteredItems();
    if(fl.length){
      html+=`<div class="sec" data-flip="sec-f"><h3>文件夹</h3><button type="button" data-act="goto-folders">全部 ${ic("chev")}</button></div>`;
      html+=`<div class="folders">${fl.map(f=>fcardHTML(f,false)).join("")}</div>`;
    }
    if(list.length){
      html+=`<div class="sec" data-flip="sec-r"><h3>${S.search&&S.q.trim()?"文件":"最近"}</h3></div>`;
      html+=`<div class="grid ${names}">${list.map(it=>tileHTML(it,S.select)).join("")}</div>`;
    }
    return html||empty;
  }
  if(ctx==="folder"){
    const list=folderItems().filter(it=>matchQ(it.name)&&matchF(it));
    return list.length?`<div class="grid ${names}" style="padding-top:2px">${list.map(it=>tileHTML(it,S.select)).join("")}</div>`:empty;
  }
  if(ctx==="folders"){
    let list=FOLDERS.filter(f=>matchQ(f.n));
    if(S.sort==="name") list=[...list].sort((a,b)=>a.n.localeCompare(b.n,"zh"));
    if(S.sort==="count") list=[...list].sort((a,b)=>b.c-a.c);
    return list.length?`<div class="fgrid" style="padding-top:8px">${list.map(f=>fcardHTML(f,S.select)).join("")}</div>`:empty;
  }
  if(ctx==="trash"){
    if(!TRASH.length) return `<div class="empty-state">${ic("trash")}<p>回收站为空</p></div>`;
    const list=TRASH.filter(t=>matchQ(t.name)&&matchF(t));
    if(!list.length) return empty;
    return `<div class="page"><div class="group">${list.map(t=>{
      const thumb=t.doc?`<div class="tthumb">${ic("filetext")}</div>`:`<div class="tthumb" style="background-image:${photo(t.seed||1,t.kind||"land")}"></div>`;
      const sel=S.select&&S.sel.has(t.id);
      const lead=S.select?`<span class="rsel">${sel?ic("tick"):""}</span>`:"";
      const acts=S.select?"":`<div class="tacts"><button type="button" class="txtbtn" data-restore="${t.id}">恢复</button><button type="button" class="txtbtn danger" data-purge="${t.id}">删除</button></div>`;
      return `<div class="row trow${sel?" sel":""}" data-tid="${t.id}">${lead}${thumb}<div class="tmeta"><b>${hl(t.name)}</b><small>${t.days} 天后删除</small></div>${acts}</div>`;
    }).join("")}</div><p class="gf">项目将在剩余天数后被永久删除。本原型仅演示界面。</p></div>`;
  }
  return settingsBody();
}

      if(g.hasAttribute("data-multi")) b.classList.toggle("on");

function closePlusMenu(after){
  const overlay=document.getElementById("a-overlay");
  const fab=document.querySelector("#a-bar .fab");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  S.plus=false;
  if(!overlay||!overlay.dataset.plusBuilt){ overlay&&(overlay.innerHTML=""); after&&after(); render(); return; }
  overlay.classList.add("closing");
  overlay.classList.remove("is-open");
  fab&&fab.classList.remove("open");
  const done=()=>{
    overlay.innerHTML="";
    delete overlay.dataset.plusBuilt;
    overlay.classList.remove("closing","is-open");
    after&&after();
    render();
  };
  if(reduce) done();
  else setTimeout(done, 160);
}

function bindAlbum(){
  const root=document.getElementById("v-album");
  root.onclick=function(e){
    if(LP.suppress){ LP.suppress=false; e.preventDefault(); e.stopPropagation(); return; }
    const rt=e.target.closest("[data-ret]");
    if(rt){ S.retention=rt.dataset.ret; render(); return; }
    const t=e.target.closest("[data-act],[data-tab],[data-theme-set],[data-filter],[data-sort],[data-folder],[data-id],[data-tid],[data-restore],[data-purge]");
    if(!t) return;
    if(t.dataset.themeSet!==undefined){ applyTheme(t.dataset.themeSet); render(); return; }
    if(t.dataset.tab){ S.tab=t.dataset.tab; S.plus=false; S.folder=null; S.sub=null; resetModes(); render(); return; }
    if(t.dataset.filter){ S.filter=t.dataset.filter; refreshBody(); return; }
    if(t.dataset.sort){ S.sort=t.dataset.sort; refreshBody(); return; }
    if(t.dataset.folder){
      if(S.select&&curCtx()==="folders"){ toggleSel(t.dataset.folder); return; }
      S.folder=t.dataset.folder; S.plus=false; resetModes(); render(); return;
    }
    if(t.dataset.tid){ if(S.select) toggleSel(t.dataset.tid); return; }
    if(t.dataset.restore){
      const id=t.dataset.restore;
      const item=TRASH.find(x=>x.id===id);
      if(item){ TRASH=TRASH.filter(x=>x.id!==id); toast("已恢复"); render(); }
      return;
    }
    if(t.dataset.purge){
      const id=t.dataset.purge;
      dialog({title:"永久删除？", text:"删除后无法恢复", ok:"删除", danger:true, onOk:()=>{
        TRASH=TRASH.filter(x=>x.id!==id); render(); toast("已删除");
      }});
      return;
    }
    if(t.dataset.id){
      const id=t.dataset.id;
      if(S.select){ toggleSel(id); } else {
        const it=ITEMS.find(x=>x.id===id);
        if(it&&it.doc) openDoc(id,"view"); else openViewer(id);
      }
      return;
    }
    const act=t.dataset.act;
    if(!act) return;
    if(act==="lock"){ lock(); return; }
    if(act==="back"){ S.tab="photos"; render(); return; }
    if(act==="doc-back"){ S.doc=null; render(); return; }
    if(act==="doc-edit"){ S.doc.mode="edit"; render(); return; }
    if(act==="doc-done"){ S.doc.mode="view"; S.doc.sheet=false; S.doc.isNew=false; toast("已保存"); render(); return; }
    if(act==="doc-aa"){ S.doc.sheet=!S.doc.sheet; render(); return; }
    if(act==="open-pin"){ S.sub="pin"; render(); return; }
    if(act==="open-retention"){ S.sub="retention"; render(); return; }
    if(act==="empty-trash"){
      const n=TRASH.length; if(!n) return;
      dialog({title:"清空回收站？", text:`将永久删除全部 ${n} 个文件，无法恢复`, ok:"清空", danger:true, onOk:()=>{ TRASH=[]; S.select=false; S.sel=new Set(); render(); toast("已清空"); }});
      return;
    }
    if(act==="open-wipe"){ S.sub="wipe"; render(); return; }
    if(act==="back-sub"){ S.sub=null; render(); return; }
    if(act==="rename-folder"){ renameFolder(S.folder); return; }
    if(act==="back-folder"){ S.folder=null; resetModes(); render(); return; }
    if(act==="toggle-search"){
      S.search=!S.search; S.plus=false;
      let keep=false;
      if(!S.search&&(S.q||S.filter!=="all")){ S.q=""; S.filter="all"; refreshBody(); keep=true; }
      S.searchAnim=true; render({keepBody:keep});
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        S.searchAnim=false;
        const box=document.getElementById("sbox"); if(box) box.classList.toggle("open",S.search);
        if(S.search){ const q=document.getElementById("q"); q&&q.focus({preventScroll:true}); }
      }));
      return;
    }
    if(act==="clear-q"){ S.q=""; const q=document.getElementById("q"); if(q){ q.value=""; q.focus(); } const c=document.querySelector("#sbox .clr"); if(c) c.classList.remove("show"); refreshBody(); return; }
    if(act==="toggle-select"){ S.select=!S.select; S.sel=new Set(); S.plus=false; render(); return; }
    if(act==="sel-rename"){
      if(S.sel.size!==1) return;
      const id=[...S.sel][0], ctx=curCtx();
      if(ctx==="folders"){ renameFolder(id); return; }
      if(ctx==="folder"){
        const it=folderItems().find(x=>x.id===id); if(!it) return;
        prompt2("重命名", it.name, ".jpg", v=>{ if(!v.trim()) return "名称不能为空"; RENAMED[S.folder+"/"+id]=v.trim(); render(); toast("已重命名"); });
        return;
      }
      renameSelected(id); return;
    }
    if(act==="sel-move"||act==="sel-export"){ toast("演示：功能占位"); return; }
    if(act==="sel-del"){
      if(curCtx()==="photos"){ deleteSelected(); return; }
      const n=S.sel.size;
      dialog({title:`删除 ${n} 项？`, text:"将移入回收站", ok:"删除", danger:true, onOk:()=>{ S.sel=new Set(); render(); toast("已删除"); }});
      return;
    }
    if(act==="sel-restore"){ TRASH=TRASH.filter(x=>!S.sel.has(x.id)); S.sel=new Set(); render(); toast("已恢复"); return; }
    if(act==="sel-purge"){
      const n=S.sel.size;
      dialog({title:`永久删除 ${n} 项？`, text:"删除后无法恢复", ok:"删除", danger:true, onOk:()=>{ TRASH=TRASH.filter(x=>!S.sel.has(x.id)); S.sel=new Set(); render(); toast("已删除"); }});
      return;
    }
    if(act==="plus"){ if(S.plus) closePlusMenu(); else { S.plus=true; render(); } return; }
    if(act==="close-plus"){ closePlusMenu(); return; }
    if(act==="add-photo"||act==="add-doc"||act==="add-folder"){ closePlusMenu(()=>{
      if(act==="add-doc"){ S.doc={id:null,title:"",isNew:true,mode:"edit",sheet:false}; }
      else if(act==="add-folder"){ setTimeout(()=>dialog({title:"新建文件夹", input:{value:"", placeholder:"文件夹名称"}, ok:"创建", onOk:(v)=>{
        if(!v.trim()) return "名称不能为空";
        FOLDERS.push({id:"f"+Date.now(),n:v.trim(),c:0,s:[]}); render(); toast("已创建");
      }}),0); }
      else toast("演示：已记录操作"); }); return; }
    if(act==="goto-folders"){ S.tab="folders"; render(); return; }
    if(act==="toggle-names"){ S.showNames=!S.showNames; render(); return; }
    if(act==="share"||act==="move"){ toast("演示：功能占位"); return; }
    if(act==="noop"){ toast("演示：功能占位"); return; }
  };
  bindLongPress(root);
  const q=document.getElementById("q");
  if(q){
    q.oninput=function(){ S.q=q.value; const c=document.querySelector("#sbox .clr"); if(c) c.classList.toggle("show",!!S.q); refreshBody(); };
  }
}

function splitName(name){
  const i=name.lastIndexOf(".");
  if(i>0) return {base:name.slice(0,i), ext:name.slice(i)};
  return {base:name, ext:""};
}

function renameFolder(id){
  const f=FOLDERS.find(x=>x.id===id); if(!f) return;
  dialog({title:"重命名文件夹", input:{value:f.n}, ok:"确定", onOk:(v)=>{
    if(!v.trim()) return "名称不能为空";
    f.n=v.trim(); render(); toast("已重命名");
  }});
}
function renameSelected(id){
  const it=ITEMS.find(x=>x.id===id)||null;
  if(!it) return;
  const {base,ext}=splitName(it.name);
  prompt2("重命名", base, ext, (val)=>{
    if(!val.trim()) return "名称不能为空";
    it.name=val.trim()+ext;
    toast("已重命名");
    render();
    return true;
  });
}

function deleteSelected(){
  const ids=[...S.sel];
  ids.forEach(id=>{
    const it=ITEMS.find(x=>x.id===id);
    if(!it) return;
    it.trash=true;
    TRASH.unshift({id:"tr_"+id, name:it.name+(it.doc?".txt":it.video?".mp4":".jpg"), days:30, seed:it.seed||1, kind:it.kind||"land", doc:!!it.doc, video:!!it.video});
  });
  S.sel=new Set();
  toast("已移入回收站");
  render();
}

/* 统一对话框组件。opts: {title, text?, input?:{value, suffix?, placeholder?}, cancel?="取消", ok?="确定", danger?, onOk(value)}
   onOk 返回字符串 = 行内错误（对话框保持打开）；其它返回值 = 关闭。 */
function dialog(opts){
  const layer=document.getElementById("layer");
  const wrap=document.createElement("div");
  wrap.className="dlg-back";
  const inp=opts.input;
  wrap.innerHTML=`<div class="dlg${inp?"":" noinput"}" role="alertdialog" aria-modal="true"><h4>${esc(opts.title)}</h4>
    ${opts.text?`<p>${esc(opts.text)}</p>`:""}
    ${inp?`<div class="din"><input id="dlg-in" type="text" value="${esc(inp.value||"")}" placeholder="${esc(inp.placeholder||"")}" autocomplete="off">${inp.suffix?`<span>${esc(inp.suffix)}</span>`:""}</div>
    <div class="derr" id="dlg-err"></div>`:""}
    <div class="dbtns"><button type="button" data-x="c">${esc(opts.cancel||"取消")}</button><button type="button" data-x="o" class="${opts.danger?"danger":""}">${esc(opts.ok||"确定")}</button></div></div>`;
  layer.appendChild(wrap);
  requestAnimationFrame(()=>requestAnimationFrame(()=>wrap.classList.add("show")));
  const el=wrap.querySelector("#dlg-in");
  if(el){ el.focus(); el.select(); }
  const close=()=>{ wrap.classList.remove("show"); setTimeout(()=>wrap.remove(),180); };
  wrap.onclick=(e)=>{
    const b=e.target.closest("[data-x]");
    if(!b) return;
    if(b.dataset.x==="c"){ close(); return; }
    const r=opts.onOk?opts.onOk(el?el.value:undefined):undefined;
    if(typeof r==="string"){ const er=wrap.querySelector("#dlg-err"); if(er) er.textContent=r; else toast(r); return; }
    close();
  };
  return wrap;
}
function prompt2(title, value, suffix, onOk){
  return dialog({title, input:{value, suffix}, ok:"确定", onOk});
}

function findItem(id){ return ITEMS.find(x=>x.id===id)||(S.folder?folderItems().find(x=>x.id===id):null); }
const PLYR_I18N={restart:"重新播放",rewind:"后退 {seektime} 秒",play:"播放",pause:"暂停",fastForward:"快进 {seektime} 秒",seek:"跳转",seekLabel:"{currentTime} / {duration}",played:"已播放",buffered:"已缓冲",currentTime:"当前时间",duration:"时长",volume:"音量",mute:"静音",unmute:"取消静音",enterFullscreen:"全屏",exitFullscreen:"退出全屏",settings:"设置",menuBack:"返回上一级",speed:"播放速度",normal:"正常",quality:"画质",loop:"循环",start:"开始",end:"结束",all:"全部",reset:"重置",disabled:"关闭",enabled:"开启"};
/* 视频播放页：Plyr。正式应用中 src 为解密后 Blob 的 object URL（URL.createObjectURL），关闭时 revoke。 */
function openVideo(it){
  const layer=document.getElementById("layer");
  const v=document.createElement("div");
  v.className="viewer vplayer";
  v.innerHTML=`<div class="vstage"><video playsinline webkit-playsinline preload="metadata" src="media/demo.mp4"></video>
      <div class="vseek l">−10 秒</div><div class="vseek r">+10 秒</div></div>
    <div class="vbar"><button type="button" class="vbtn" data-x="back">${ic("chevl")}返回</button>
    <b>${esc(it.name)}</b>
    <button type="button" class="vbtn" data-x="ren">${ic("pen")}重命名</button></div>`;
  layer.appendChild(v);
  const video=v.querySelector("video");
  let player=null;
  if(window.Plyr){
    player=new Plyr(video,{
      controls:["play-large","rewind","play","fast-forward","progress","current-time","duration","mute","volume","settings","fullscreen"],
      settings:["speed"], speed:{selected:1,options:[0.5,0.75,1,1.25,1.5,2]}, seekTime:10,
      invertTime:false, toggleInvert:false, displayDuration:true, hideControls:true, resetOnEnd:false,
      fullscreen:{enabled:true,fallback:true,iosNative:true},
      tooltips:{controls:false,seek:true}, keyboard:{focused:true,global:false},
      iconUrl:"vendor/plyr/plyr.svg", blankVideo:"vendor/plyr/blank.mp4", i18n:PLYR_I18N
    });
    player.on("controlshidden",()=>v.classList.add("chrome-hidden"));
    player.on("controlsshown",()=>v.classList.remove("chrome-hidden"));
    v._player=player;
  } else { video.controls=true; }
  /* 双击 / 双指点左右三分之一：−10 / +10 秒（中间保留 Plyr 的双击全屏） */
  const stage=v.querySelector(".vstage");
  let last=0, lastSide="";
  const sideOf=x=>{ const r=stage.getBoundingClientRect(), f=(x-r.left)/r.width; return f<1/3?"l":f>2/3?"r":""; };
  const bubble=side=>{ const b=v.querySelector(".vseek."+side); b.classList.add("show"); clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove("show"),500); };
  stage.addEventListener("pointerup",e=>{
    if(e.target.closest(".plyr__controls,.plyr__menu__container,.plyr__control--overlaid")) return;
    const side=sideOf(e.clientX), now=Date.now();
    if(side&&side===lastSide&&now-last<300){
      const d=side==="l"?-10:10;
      video.currentTime=Math.max(0,Math.min((video.duration||0),video.currentTime+d));
      bubble(side); last=0; lastSide=""; return;
    }
    last=now; lastSide=side;
  },true);
  stage.addEventListener("dblclick",e=>{ if(sideOf(e.clientX)) e.stopPropagation(); },true);
  const close=()=>{ try{ player&&player.destroy(); }catch(_){} v.remove(); };
  v.addEventListener("click",(e)=>{
    const b=e.target.closest("[data-x]");
    if(!b) return;
    if(b.dataset.x==="back"){ close(); return; }
    if(b.dataset.x==="ren"){
      const {base,ext}=splitName(it.name);
      prompt2("重命名", base, ext||".mp4", (val)=>{
        if(!val.trim()) return "名称不能为空";
        it.name=val.trim()+(ext||".mp4");
        v.querySelector(".vbar b").textContent=it.name;
        toast("已重命名");
        return true;
      });
    }
  });
  return v;
}
function openViewer(id){

  if(it&&it.video&&!it.doc){ openVideo(it); return; }
  if(!it||it.doc){ toast(it?("文档："+it.name):"无法打开"); return; }

/* ========== 计算器交互 ========== */
function wireCalc(){
  const mode=document.getElementById("calc-mode");
  mode.onclick=(e)=>{
    const b=e.target.closest("[data-mode]"); if(!b) return;
    S.calcMode=b.dataset.mode;
    [...mode.querySelectorAll("[data-mode]")].forEach(x=>x.classList.toggle("on",x===b));
    document.getElementById("mortgage-form").hidden = S.calcMode!=="mortgage";
    document.getElementById("tax-form").hidden = S.calcMode!=="tax";
    document.getElementById("calc-title").textContent = S.calcMode==="tax"?"个税计算":"房贷计算";
  };
  const rep=document.getElementById("repayment");
  rep.onclick=(e)=>{
    const b=e.target.closest("[data-rep]"); if(!b) return;
    S.repayment=b.dataset.rep;
    [...rep.querySelectorAll("[data-rep]")].forEach(x=>x.classList.toggle("on",x===b));
  };
  ["loan-amount","loan-years","loan-rate","tax-income","tax-insurance","tax-deduction"].forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener("input",()=>{ el.value=sanitizeDecimal(el.value); });
  });

  document.getElementById("mortgage-form").onsubmit=(e)=>{
    e.preventDefault();
    const amountEl=document.getElementById("loan-amount");
    const yearsEl=document.getElementById("loan-years");
    const rateEl=document.getElementById("loan-rate");
    const err=document.getElementById("mortgage-error");
    const res=document.getElementById("mortgage-result");
    err.hidden=true; res.hidden=true;
    document.getElementById("fr-amount").classList.remove("err");

    const raw=amountEl.value.trim();
    if(raw===DEMO_PIN){ openAlbum(); return; }

    const principal=parseAmount(raw);
    const years=parseAmount(yearsEl.value);
    const rate=parseAmount(rateEl.value);
    if(principal===null||principal<=0){
      err.textContent="请输入有效的贷款金额"; err.hidden=false;
      document.getElementById("fr-amount").classList.add("err"); return;
    }
    if(years===null||years<=0||years>50){ err.textContent="请输入 1–50 的贷款年限"; err.hidden=false; return; }
    if(rate===null||rate<0||rate>100){ err.textContent="请输入有效的年利率"; err.hidden=false; return; }
    try{
      const out=calculateMortgage({principalYuan:principal,years,annualRatePercent:rate,repayment:S.repayment});
      const isEP=S.repayment==="equal-payment";
      res.innerHTML=`<div class="rh"><small>${isEP?"等额本息":"等额本金"} · ${out.months} 期</small><b>计算结果</b></div>
        <div class="sum">贷款本金 ${fmt(principal)} 元</div>
        <div class="big"><span>${isEP?"每月月供":"首月月供"}</span><div>${fmt(out.firstPayment)}<i>元</i></div></div>
        ${isEP?"":`<div class="kv"><span>每月递减</span><b>${fmt(out.monthlyDecrease)}<i>元</i></b></div>`}
        <div class="kv"><span>支付利息</span><b>${fmt(out.totalInterest)}<i>元</i></b></div>
        <div class="kv"><span>还款总额</span><b>${fmt(out.totalPayment)}<i>元</i></b></div>
        <p class="note">以上为按月计息估算，未计入提前还款、利率浮动或银行手续费。</p>`;
      res.hidden=false;
    }catch(ex){ err.textContent=ex.message||"计算失败"; err.hidden=false; }
  };

  document.getElementById("tax-form").onsubmit=(e)=>{
    e.preventDefault();
    const income=parseAmount(document.getElementById("tax-income").value);
    const ins=parseAmount(document.getElementById("tax-insurance").value);
    const ded=parseAmount(document.getElementById("tax-deduction").value);
    const err=document.getElementById("tax-error");
    const res=document.getElementById("tax-result");
    err.hidden=true; res.hidden=true;
    if(income===null){ err.textContent="请输入有效的税前月收入"; err.hidden=false; return; }
    if(ins===null||ded===null){ err.textContent="请输入有效的扣除项"; err.hidden=false; return; }
    try{
      const out=calculateIncomeTax({monthlyIncome:income,socialInsurance:ins,specialDeduction:ded});
      res.innerHTML=`<div class="rh"><small>综合所得 · 月度估算</small><b>计算结果</b></div>
        <div class="big"><span>应缴个税</span><div>${fmt(out.payableTax)}<i>元</i></div></div>
        <div class="kv"><span>应纳税所得额</span><b>${fmt(out.taxableIncome)}<i>元</i></b></div>
        <div class="kv"><span>税后收入</span><b>${fmt(out.afterTaxIncome)}<i>元</i></b></div>
        <p class="note">按现行七级超额累进税率估算，未覆盖年终奖、劳务等特殊情形。</p>`;
      res.hidden=false;
    }catch(ex){ err.textContent=ex.message||"计算失败"; err.hidden=false; }
  };
}

applyTheme(S.themePref);
wireCalc();
showView();


</script>
</body>
