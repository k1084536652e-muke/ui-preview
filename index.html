body{color:var(--text);overflow:hidden;

[data-theme=day] .row.sel .rsel{background:#fff;border-color:#000;color:#000}
/* 多选标记常驻 DOM，仅靠 class 显隐：进入 / 退出多选不重建网格、不改布局（§25） */
#a-body:not(.selecting) .mark,#a-body:not(.selecting) .rsel{display:none}

.mark svg.i,.rsel svg.i{opacity:0}
.sel .mark svg.i,.row.sel .rsel svg.i{opacity:1}

.trow .rsel{margin-left:auto;margin-right:10px}
/* 系统文件选择器的锚点：透明地覆盖在 + 上，使 iOS 菜单从 + 附近弹出 */
.picker-input{position:fixed;width:38px;height:38px;opacity:0;pointer-events:none;z-index:-1}
.empty-note{padding:48px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab-h) + var(--tab-pb));padding:0 var(--safe-right) var(--tab-pb) var(--safe-left);
  background:var(--bar);
  border-top:.5px solid var(--sep);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;z-index:var(--z-chrome)}
/* Tab 栏仅图标：当前页 = 线框图标、文字色（高亮），其它 = 灰色线框（不用实心）。
   图标区高 --tab-h(40px)：图标上 10px、下 6px；按钮向下延伸覆盖底部垫高区，整格可点（≥46px）。
   底部垫高 --tab-pb = max(安全区, 6px)：图标底到屏幕底 = 6 + 34 = 40px，与带文字版「文字底→屏幕底」一致 */
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:calc((var(--tab-h) - 24px) * .625);color:var(--muted);position:relative}
.tabbar .tab{margin-bottom:calc(-1 * var(--tab-pb));padding-bottom:var(--tab-pb)}
.tab svg.i{width:24px;height:24px}
.tab.on{color:var(--text)}
.tab:disabled{opacity:.35;cursor:default}
.actionbar .tab{color:var(--icon)}
.actionbar .tab.danger{color:var(--danger)}
.badge{position:absolute;top:calc((var(--tab-h) - 24px) * .625 - 6px);left:50%;margin-left:7px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
/* 「＋」：38px（原 46px），颜色逻辑同其它 Tab：平时灰色，菜单打开/按下时为文字色 */
.fab{width:38px;height:38px;margin-top:-7px;border-radius:19px;background:var(--muted);color:var(--bg);display:grid;place-items:center;transition:background .28s ease,color .28s ease,border-color .28s ease}
.fab svg.i{width:22px;height:22px;stroke-width:2.2;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.fab.open svg.i{transform:rotate(45deg)}
.fab.open,.tab:active .fab{background:var(--text)}
[data-theme=day] .fab{background:#fff;color:var(--muted);border:2px solid currentColor}
[data-theme=day] .fab.open,[data-theme=day] .tab:active .fab{background:#fff;color:#000}
#a-overlay{position:absolute;inset:0;pointer-events:none;z-index:var(--z-overlay)}
#a-overlay.is-open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .28s ease}
#a-overlay.is-open .scrim{opacity:1}
#a-overlay.closing .scrim{transition-duration:.21s}
#a-overlay.noanim *,.fab.noanim,.fab.noanim *{transition:none!important}
.pop{position:absolute;left:50%;bottom:calc(var(--tab-h) + var(--tab-pb) + 10px);width:236px;background:var(--sheet);border-radius:14px;z-index:25;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35);
  transform-origin:bottom center;opacity:0;transform:translateX(-50%) translateY(8px) scale(.85);
  transition:opacity .3s cubic-bezier(.2,.9,.3,1.15),transform .32s cubic-bezier(.2,.9,.3,1.15);pointer-events:none}
#a-overlay.is-open .pop{opacity:1;transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto}
#a-overlay.closing .pop{transition-duration:.21s;transition-timing-function:cubic-bezier(.4,0,.6,1)}
.pop button{width:100%;height:50px;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:16px;border-bottom:.5px solid var(--sep);text-align:left;
  opacity:0;transform:translateY(6px);transition:opacity .27s ease,transform .27s cubic-bezier(.2,.8,.2,1)}
.pop button:last-child{border:0}
#a-overlay.is-open .pop button{opacity:1;transform:translateY(0)}
#a-overlay.is-open .pop button:nth-child(1){transition-delay:40ms}
#a-overlay.is-open .pop button:nth-child(2){transition-delay:80ms}
#a-overlay.is-open .pop button:nth-child(3){transition-delay:120ms}
#a-overlay.closing .pop button{transition-duration:.17s;transition-delay:0ms!important}
.tacts{display:flex;align-items:center;gap:0;flex:0 0 auto;margin-left:auto}

@media (prefers-reduced-motion:reduce){

.page{padding:8px 16px 0;max-width:720px;margin:0 auto}
.gh{font-size:13px;color:var(--muted);padding:18px 16px 7px;letter-spacing:.2px}
.group{background:var(--group);border-radius:12px;overflow:hidden}
.row{min-height:46px;display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;font-size:16px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}

.verrow{min-height:60px;padding-top:8px;padding-bottom:8px}

.vdot{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--danger);margin-left:6px;vertical-align:2px}

.upbtn{margin-left:auto;flex:0 0 auto;height:32px;padding:0 14px;border-radius:16px;background:var(--text);color:var(--bg);font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}

.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:vspin .8s linear infinite}

.tdot{position:absolute;top:calc((var(--tab-h) - 24px) * .625 - 2px);left:50%;margin-left:9px;width:8px;height:8px;border-radius:4px;background:var(--danger);box-shadow:0 0 0 2px var(--bar)}
.toggle{margin-left:auto;width:51px;height:31px;border-radius:16px;background:var(--surface-2);position:relative;transition:background .2s;flex:0 0 auto}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}

.toggle.on::after{transform:translateX(20px);background:var(--bg)}
.trow{min-height:62px;padding-right:4px}

  padding:12px calc(var(--safe-right) + 16px) calc(var(--safe-bottom) + 24px) calc(var(--safe-left) + 16px)}

.frow .seg.mini{flex:0 0 auto;width:180px;height:28px;margin:0 0 0 auto;cursor:default}

.chead{display:flex;align-items:flex-end;justify-content:space-between;padding:4px 4px 10px}

.frow{min-height:50px;cursor:text}

.cta{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:13px;margin:18px 0 0;font-size:17px;font-weight:650;letter-spacing:1px;background:var(--text);color:var(--bg)}

.res{margin-top:18px;background:var(--group);border-radius:14px;padding:14px 16px 4px}

.res .big>div span{font-size:inherit;color:var(--text)}

/* 统一对话框：标题 + 可选灰字说明 + 可选输入框 + 行内错误 + 两个按钮（右侧为主操作，危险操作为红色） */
.dlg-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:var(--z-modal);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .18s ease}

.dlg.noinput .dbtns{margin-top:16px}
.dlg h4{font-size:17px;font-weight:650;padding:18px 16px 4px}

.dlg.pgd{width:min(300px,100%);padding-top:18px}

.pgd.is-done .pg-ic .spin{opacity:0;transform:scale(.6)}

.fp-n b{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-n small{font-size:12px;color:var(--muted)}
.fp-new .fp-n{font-size:16px;font-weight:550}
.fp-ck{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--faint);display:grid;place-items:center;flex:0 0 auto;transition:background .15s ease,border-color .15s ease}
.fp-ck svg.i{width:14px;height:14px;stroke-width:3}
.fp-ck.all,.fp-ck.some{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fp-ck.some i{width:10px;height:2.5px;border-radius:2px;background:currentColor}
[data-theme=day] .fp-ck.all,[data-theme=day] .fp-ck.some{background:#fff;border-color:#000;color:#000}
.fp-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
/* 设置子页：解锁码 / 紧急清除码 */
.nav-row.sub{padding:0 16px 0 4px}
.nav-row.sub .back{width:40px;justify-content:center;flex:0 0 auto}
.subpage{padding-bottom:8px}
.subpage .frow .lab{min-width:96px}
.subpage .frow input{letter-spacing:3px}
.subpage .frow input::placeholder{letter-spacing:0}
.subpage .ferr{padding:6px 16px 0}
.subpage .cta{margin-top:20px}
.infocard{margin-top:12px;background:var(--group);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--muted);line-height:1.55}
.dangerbtn{display:block;width:100%;height:44px;margin-top:10px;font-size:16px;font-weight:550;color:var(--danger);text-align:center}
.dangerbtn:disabled{opacity:.35;cursor:default}
/* 文档页（备忘录风格）：浏览 / 编辑 同一页 */
.notepage{padding-top:0}
.scroll.notepage{padding-bottom:24px}
.note{max-width:720px;margin:0 auto;padding:6px 20px 32px;font-size:17px;line-height:1.55;word-break:break-word}
.note-meta{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 12px;font-variant-numeric:tabular-nums}
.note-title{font-size:26px;font-weight:700;line-height:1.3;letter-spacing:-.3px;outline:0;margin-bottom:6px}
.note-body{outline:0;min-height:40vh}
.note [contenteditable=true]{caret-color:var(--text)}
.note-title:empty::before{content:attr(data-ph);color:var(--faint)}
.note-body:empty::before{content:attr(data-ph);color:var(--faint)}
.note h2{font-size:21px;font-weight:700;line-height:1.35;margin:14px 0 4px}
.note h3{font-size:18px;font-weight:650;line-height:1.4;margin:12px 0 2px}
.note p{margin:0 0 6px}
.note u{text-underline-offset:3px}
.note s{color:var(--muted)}
.note .c-red{color:var(--n-red)} .note .c-blue{color:var(--n-blue)}
.note ul,.note ol{margin:2px 0 6px;padding-left:26px}
.note li{padding-left:2px;margin:1px 0}
.note ul li::marker{color:var(--muted)}
.note ol li::marker{font-variant-numeric:tabular-nums;color:var(--muted)}
.note ul.checks{list-style:none;padding-left:0}
.note ul.checks li{display:flex;align-items:flex-start;gap:10px;margin:5px 0;padding-left:0}
.ckb{flex:0 0 auto;width:22px;height:22px;border-radius:11px;border:1.5px solid var(--faint);margin-top:2px;display:grid;place-items:center}
.ckb svg.i{width:14px;height:14px;stroke-width:3}
li.done .ckb{background:var(--text);border-color:var(--text);color:var(--bg)}
li.done>span:last-child{color:var(--muted);text-decoration:line-through}
.nav-row.three .r.strong{font-weight:650}
/* 编辑工具条：贴在键盘上方（原型中贴底） */
.etb{position:relative;flex:0 0 auto;height:calc(44px + var(--safe-bottom));padding:0 calc(var(--safe-right) + 6px) var(--safe-bottom) calc(var(--safe-left) + 6px);
  background:var(--bar);
  border-top:.5px solid var(--sep);display:flex;align-items:center;justify-content:space-between;z-index:var(--z-chrome)}
.etb .ibtn{width:38px;height:36px;border-radius:9px}
.etb .ibtn.on{background:var(--surface-2)}
.etb .txtbtn{font-weight:650;padding:0 6px}
/* 「Aa」格式面板 */
.fsheet{position:absolute;left:0;right:0;bottom:calc(44px + var(--safe-bottom));background:var(--fs-sheet);border-radius:14px 14px 0 0;
  box-shadow:0 -6px 24px rgba(0,0,0,.18);border-top:.5px solid var(--sep);padding:10px calc(var(--safe-right) + 14px) 14px calc(var(--safe-left) + 14px);pointer-events:auto;
  display:flex;flex-direction:column;gap:10px;z-index:var(--z-sheet)}
.fs-head{display:flex;align-items:center;justify-content:space-between}
.fs-head b{font-size:17px;font-weight:650}
.fs-x{width:30px;height:30px;border-radius:15px;background:var(--fs-grp);display:grid;place-items:center;color:var(--muted)}
.fs-x svg.i{width:16px;height:16px;stroke-width:2.4}
.fs-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fs-chips button{height:34px;border-radius:9px;background:var(--fs-grp);white-space:nowrap;font-size:14px}
.fs-chips button.on{background:var(--text);color:var(--bg);font-weight:650}
.fs-chips .t1{font-weight:700;font-size:16px}
.fs-chips .t2{font-weight:650}
.fs-chips .mono{font-family:ui-monospace,Menlo,"SF Mono",monospace;font-size:13px}
.fs-row{display:flex;gap:8px}
.fs-grp{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fs-grp);border-radius:10px;overflow:hidden;height:40px}
.fs-grp button{display:grid;place-items:center;font-size:17px;position:relative}
.fs-grp button+button::before{content:"";position:absolute;left:0;top:9px;bottom:9px;border-left:.5px solid var(--sep)}
.fs-grp button.on{background:var(--text);color:var(--bg)}
.fs-grp button.on::before,.fs-grp button.on+button::before{display:none}
.fs-grp svg.i{width:20px;height:20px}
.fs-grp .fb{font-weight:800}.fs-grp .fi{font-style:italic;font-family:Georgia,serif}.fs-grp .fu{text-decoration:underline;text-underline-offset:3px}.fs-grp .fx{text-decoration:line-through}
.fs-size{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fs-size>span{font-size:15px}
.stepper{display:flex;align-items:center;background:var(--fs-grp);border-radius:10px;height:36px}
.stepper button{width:44px;height:36px;display:grid;place-items:center}
.stepper button svg.i{width:18px;height:18px}
.stepper output{min-width:40px;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;border-left:.5px solid var(--sep);border-right:.5px solid var(--sep);line-height:20px}
.swatches{display:flex;justify-content:space-between;padding:2px 2px 0}
.sw{width:30px;height:30px;border-radius:15px;border:.5px solid var(--sep)}
.sw.on{box-shadow:0 0 0 2px var(--fs-sheet),0 0 0 4px var(--text)}
/* 原地搜索面板：从顶栏下方展开 / 收起 */
.nav .ibtn.on{background:var(--surface-2)}
.nav-row.sub.icons{padding-right:8px}
.sbox{position:absolute;left:0;right:0;top:100%;margin-top:0;box-shadow:0 -1px 0 var(--bar);background:var(--bar);z-index:var(--z-searchpanel);display:grid;grid-template-rows:0fr;transition:grid-template-rows .36s cubic-bezier(.2,.8,.2,1),box-shadow .36s ease}

  background:var(--bar);border-top:.5px solid var(--sep);z-index:var(--z-selbar);
  transform:translateY(100%);opacity:0;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s ease;pointer-events:none}
.selbar.show{transform:none;opacity:1;pointer-events:auto}
.selbar.hiding{transition:transform .3s cubic-bezier(.4,0,.8,1),opacity .28s ease}

.selbar.last{bottom:0;height:calc(44px + var(--safe-bottom));padding-bottom:var(--safe-bottom)}
.selbar .sc{font-size:14px;color:var(--muted);white-space:nowrap}
.selbar .sc b{color:var(--text);font-weight:650;font-variant-numeric:tabular-nums}
/* A-03 分页态：固定高度，切换文案不抖动 */
.page-end{height:44px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--faint);font-size:12px;letter-spacing:.2px;flex:0 0 auto;user-select:none}
.page-end .spin{width:12px;height:12px;border-width:1.5px}
.page-end.done{color:var(--faint)}
/* R7：清空全部数据独立危险按钮（非菜单行） */
.dangerbtn.settings-clear{margin-top:14px;height:50px;border-radius:13px;background:var(--group);font-weight:600}
.dangerbtn.settings-clear:active{opacity:.75}
.dlg .din input[type=password]{letter-spacing:3px;-webkit-text-security:disc}
.dlg .din input[type=password]::placeholder{letter-spacing:0}
/* A-08 更新失败 */
.upbtn.retry{background:transparent;color:var(--text);border:1px solid var(--sep);font-weight:600}
.verrow.fail .vs{color:var(--danger)}
/* A-06 空状态 */
.empty-state.soft{padding:64px 24px}
.empty-note.search-empty{padding:56px 24px}
.sacts{margin-left:auto;display:flex;gap:2px}
.sbtn{height:40px;min-width:44px;padding:0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:550;color:var(--text);border-radius:8px;white-space:nowrap}
.sbtn svg.i{width:20px;height:20px}
.sbtn.danger{color:var(--danger)}
.sbtn:disabled{opacity:.35;cursor:default}
#v-album.selmode ~ #layer .toast{bottom:calc(var(--tab-h) + var(--tab-pb) + 58px)}
.fwrap{position:relative}
.fwrap::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none}
.fgrid .fwrap::after{border-radius:12px}
.fcard.sel .fwrap::after{box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 4px var(--ring)}
.fcover.empty+.mark{border-color:var(--faint);background:transparent;box-shadow:none}
.fcard.sel .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 1px var(--ring),0 1px 3px rgba(0,0,0,.3)}
.rsel{flex:0 0 auto;width:22px;height:22px;border-radius:11px;border:1.5px solid var(--faint);display:grid;place-items:center}
.row.sel .rsel{background:var(--text);border-color:var(--text);color:var(--bg)}
.rsel svg.i{width:14px;height:14px;stroke-width:3}
@media (prefers-reduced-motion:reduce){.sbox,.sbox .search-wrap{transition:none!important}}
/* 长按进入多选：禁止 iOS 文本选择 / 长按菜单 */
.cell,.fcard,.trow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ibtn.danger:active{color:var(--danger)}
.empty-state{padding:72px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--faint);font-size:15px}
.empty-state svg.i{width:48px;height:48px;stroke-width:1.4}
.empty-state p{color:var(--muted)}
.row .ck{margin-left:auto;color:var(--text)}
.row .ck svg.i{width:20px;height:20px;stroke-width:2.4}
/* 视频播放页（Plyr，单色主题；控件在视频上方，两种主题都用白色控件） */
.vplayer{background:#000}
.vplayer .vbar{z-index:6;transition:opacity .3s ease,transform .3s ease}
.vplayer.chrome-hidden .vbar{opacity:0;transform:translateY(-8px);pointer-events:none}
.vstage{position:absolute;inset:0}
.vstage .plyr{height:100%;

  --plyr-range-track-height:3px; --plyr-range-thumb-height:12px; --plyr-range-thumb-background:#fff; --plyr-range-thumb-shadow:0 1px 3px rgba(0,0,0,.35);
  --plyr-video-progress-buffered-background:rgba(255,255,255,.38); --plyr-video-range-track-background:rgba(255,255,255,.2);
  --plyr-video-controls-background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.72));
  --plyr-menu-background:rgba(28,28,30,.97); --plyr-menu-color:#fff; --plyr-menu-radius:14px; --plyr-menu-arrow-color:#8e8e93;
  --plyr-menu-back-border-color:rgba(255,255,255,.12); --plyr-menu-back-border-shadow-color:transparent; --plyr-menu-shadow:0 12px 40px rgba(0,0,0,.45);
  --plyr-control-toggle-checked-background:#fff; --plyr-tooltip-background:#fff; --plyr-tooltip-color:#000; --plyr-tooltip-radius:8px;
  --plyr-font-family:inherit; --plyr-font-size-menu:15px; --plyr-font-size-time:13px; --plyr-focus-visible-color:#fff}
[data-theme=day] .vstage .plyr{--plyr-menu-background:rgba(255,255,255,.98); --plyr-menu-color:#000; --plyr-menu-back-border-color:rgba(0,0,0,.12); --plyr-control-toggle-checked-background:#000}
.vstage .plyr__menu__container .plyr__control[role=menuitemradio]::after{background:var(--bg);left:17px}
.vstage .plyr__menu__container .plyr__control[role=menuitemradio]::before{background:rgba(127,127,127,.28)}
.vstage .plyr__menu__container .plyr__control[role=menuitemradio][aria-checked=true]::before{background:var(--plyr-control-toggle-checked-background)}
.vstage .plyr__menu__container [role=menu]{padding:6px}
.vstage .plyr__menu__container .plyr__control{padding:9px 12px;border-radius:9px}
.vstage .plyr__menu__container .plyr__control:hover{background:rgba(127,127,127,.16);color:inherit}
.vstage .plyr__control--overlaid{background:rgba(255,255,255,.92);color:#000;padding:20px;opacity:1}
.vstage .plyr__control--overlaid svg{width:30px;height:30px;left:2px}
.vstage .plyr__control--overlaid:hover{background:#fff;color:#000}
.vstage .plyr__controls{flex-wrap:wrap;row-gap:2px;padding:28px calc(var(--safe-right) + 8px) calc(var(--safe-bottom) + 8px) calc(var(--safe-left) + 8px)}

.row.segrow.labeled .seg{flex:none;width:100%;height:34px}

@media (prefers-reduced-motion:reduce){.toast,.dlg-back,.dlg{transition:none!important}}

<div id="sbplate" aria-hidden="true"></div>
<!-- ========== 计算器（解锁前的伪装页） ========== -->
<section class="view" id="v-calc" aria-label="房贷计算器">
  <div class="topback" aria-hidden="true"></div>
  <header class="nav"><div class="nav-row three">
    <span></span><div class="mid" id="calc-title">房贷计算</div>
    <span class="r"></span>
  </div></header>
  <main class="calc"><div class="calc-inner">
    <div class="seg" role="tablist" id="calc-mode">
      <button type="button" class="on" data-mode="mortgage">房贷计算</button>
      <button type="button" data-mode="tax">个税计算</button>
    </div>

    <form id="mortgage-form" novalidate autocomplete="off">
      <div class="chead"><div><small>商业贷款</small><b>月供估算</b></div><span class="pill">LPR 参考 3.10%</span></div>
      <div class="group">
        <label class="row frow" id="fr-amount"><span class="lab">贷款金额</span><input id="loan-amount" inputmode="decimal" placeholder="请输入金额" enterkeyhint="done"><span class="unit">元</span></label>
        <label class="row frow" id="fr-years"><span class="lab">贷款年限</span><input id="loan-years" inputmode="numeric" value="30"><span class="unit">年</span></label>
        <label class="row frow" id="fr-rate"><span class="lab">年利率</span><input id="loan-rate" inputmode="decimal" value="3.10"><span class="unit">%</span></label>
        <div class="row frow"><span class="lab">还款方式</span><div class="seg mini" id="repayment">
          <button type="button" class="on" data-rep="equal-payment">等额本息</button>
          <button type="button" data-rep="equal-principal">等额本金</button>
        </div></div>
      </div>
      <div class="ferr" id="mortgage-error" hidden></div>
      <button type="submit" class="cta" id="mortgage-submit">计算</button>
      <div class="res" id="mortgage-result" hidden></div>
    </form>

    <form id="tax-form" novalidate autocomplete="off" hidden>
      <div class="chead"><div><small>综合所得 · 月度</small><b>个税估算</b></div><span class="pill">起征点 5,000</span></div>
      <div class="group">
        <label class="row frow" id="fr-income"><span class="lab">税前月收入</span><input id="tax-income" inputmode="decimal" placeholder="请输入金额"><span class="unit">元</span></label>
        <label class="row frow"><span class="lab">五险一金</span><input id="tax-insurance" inputmode="decimal" value="0"><span class="unit">元</span></label>
        <label class="row frow"><span class="lab">专项附加扣除</span><input id="tax-deduction" inputmode="decimal" value="0"><span class="unit">元</span></label>
        <label class="row frow"><span class="lab">年终奖收入</span><input id="tax-bonus" inputmode="decimal" value="0"><span class="unit">元</span></label>
      </div>
      <div class="ferr" id="tax-error" hidden></div>
      <button type="submit" class="cta" id="tax-submit">计算</button>
      <div class="res" id="tax-result" hidden></div>
    </form>

    <p class="disc">计算结果仅供参考，实际以贷款机构及税务机关核定为准。</p>
  </div></main>
</section>

<!-- ========== 后台（相册） ========== -->
<section class="view" id="v-album" aria-label="相册" hidden>
  <div class="topback" aria-hidden="true"></div>
  <header class="nav" id="a-nav"></header>
  <!-- 网格 / 列表内容区。正式应用的分页 / 增量加载（首屏约 20 项、IntersectionObserver 哨兵、缩略图懒解密与缓存）见 DESIGN-NOTES.md「18. Paged / incremental loading」。 -->
  <div class="scroll" id="a-body"></div>
  <div class="selbar" id="a-sel" hidden></div>
  <div id="a-overlay"></div>
  <nav class="tabbar" id="a-bar"></nav>
</section>
<div id="layer"></div>
<script>
const I = {

function photo(seed,kind){
  const r=rng(seed*9301+49297), p=palettes[seed%palettes.length];
  const uid='p'+seed+kind;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${uid}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p[1]}"/><stop offset="1" stop-color="${p[0]}"/></linearGradient><radialGradient id="${uid}g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>`;
  if(kind==="macro"){
    s+=`<rect width="100" height="100" fill="${p[3]}"/>`;
    for(let k=0;k<5;k++){const cx=r()*100,cy=r()*100,rr=18+r()*30;s+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="${p[k%3]}" opacity="${.35+r()*.4}"/>`}
    s+=`<rect width="100" height="100" fill="url(#${uid}g)" opacity=".15"/>`;
  } else if(kind==="city"){
    s+=`<rect width="100" height="100" fill="url(#${uid}s)"/>`;
    let x=0;while(x<100){const w=8+r()*14,h=25+r()*45;s+=`<rect x="${x}" y="${100-h}" width="${w}" height="${h}" fill="${p[3+(r()>.5?1:0)]}"/>`;
      for(let yy=100-h+5;yy<96;yy+=7)for(let xx=x+2;xx<x+w-3;xx+=5) if(r()>.55) s+=`<rect x="${xx}" y="${yy}" width="2" height="3" fill="${p[0]}" opacity=".8"/>`;
      x+=w+1;}
  } else {
    const hz=45+r()*20;
    s+=`<rect width="100" height="100" fill="url(#${uid}s)"/>`;
    s+=`<circle cx="${20+r()*60}" cy="${hz-12-r()*15}" r="${6+r()*6}" fill="#fff" opacity=".75"/>`;
    const ridge=(base,amp,col,op)=>{let d=`M0 100 L0 ${base}`;for(let x=0;x<=100;x+=10)d+=` L${x} ${base-r()*amp}`;d+=` L100 100Z`;return `<path d="${d}" fill="${col}" opacity="${op}"/>`};
    s+=ridge(hz,18,p[2],.9)+ridge(hz+12,14,p[3],1)+ridge(hz+26,8,p[4],1);
  }
  s+=`</svg>`;
  /* base64 + single-quoted url() — avoids breaking style="..." and works in iOS Safari */
  const b64=btoa(unescape(encodeURIComponent(s)));
  return `url('data:image/svg+xml;base64,${b64}')`;
}

/* ========== 财务计算（移植自 calc-vault/js/finance.js） ========== */
const MAX_AMOUNT_INTEGER_DIGITS=9, MAX_AMOUNT_DECIMAL_DIGITS=2;
const MONEY_FORMATTER=new Intl.NumberFormat("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:true});
const TAX_BRACKETS=[
  {limit:3000,rate:.03,deduction:0},{limit:12000,rate:.1,deduction:210},
  {limit:25000,rate:.2,deduction:1410},{limit:35000,rate:.25,deduction:2660},
  {limit:55000,rate:.3,deduction:4410},{limit:80000,rate:.35,deduction:7160},
  {limit:Number.POSITIVE_INFINITY,rate:.45,deduction:15160},
];
function roundMoney(v){return Math.round((v+Number.EPSILON)*100)/100}
function validDecimalText(v){return /^(?:0|[1-9]\d{0,8})(?:\.\d{1,2})?$/.test(v)}
function sanitizeDecimal(value){
  const cleaned=value.replace(/[^\d.]/g,"");
  const [integerPart="",...decimalParts]=cleaned.split(".");
  const integer=integerPart.slice(0,MAX_AMOUNT_INTEGER_DIGITS);
  if(decimalParts.length===0) return integer;
  return `${integer}.${decimalParts.join("").slice(0,MAX_AMOUNT_DECIMAL_DIGITS)}`;
}
function parseAmount(value){
  const normalized=value.trim();
  if(!validDecimalText(normalized)) return null;
  const amount=Number(normalized);
  return Number.isFinite(amount)?amount:null;
}
function fmt(v){return Number.isFinite(v)?MONEY_FORMATTER.format(roundMoney(Math.max(0,v))):"—"}
function calculateMortgage({principalYuan,years,annualRatePercent,repayment}){
  const months=Math.round(years*12);
  if(!Number.isFinite(principalYuan)||principalYuan<=0||!Number.isFinite(months)||months<=0||!Number.isFinite(annualRatePercent)||annualRatePercent<0)
    throw new RangeError("贷款参数无效");
  const monthlyRate=annualRatePercent/100/12;
  const basePrincipalPayment=principalYuan/months;
  let firstPayment, monthlyDecrease=0, totalInterest, totalPayment;
  if(repayment==="equal-principal"){
    firstPayment=basePrincipalPayment+principalYuan*monthlyRate;
    monthlyDecrease=basePrincipalPayment*monthlyRate;
    totalInterest=principalYuan*monthlyRate*((months+1)/2);
    totalPayment=principalYuan+totalInterest;
  } else {
    if(monthlyRate===0) firstPayment=basePrincipalPayment;
    else {const factor=(1+monthlyRate)**months; firstPayment=(principalYuan*monthlyRate*factor)/(factor-1);}
    totalPayment=firstPayment*months;
    totalInterest=totalPayment-principalYuan;
  }
  if(![firstPayment,monthlyDecrease,totalInterest,totalPayment].every(Number.isFinite))
    throw new RangeError("贷款结果超出可计算范围");
  return {months,firstPayment:roundMoney(firstPayment),monthlyDecrease:roundMoney(monthlyDecrease),totalInterest:roundMoney(totalInterest),totalPayment:roundMoney(totalPayment)};
}
function calculateIncomeTax({monthlyIncome,socialInsurance,specialDeduction,yearEndBonus=0}){
  if(![monthlyIncome,socialInsurance,specialDeduction,yearEndBonus].every(Number.isFinite)||monthlyIncome<0||socialInsurance<0||specialDeduction<0||yearEndBonus<0)
    throw new RangeError("收入参数无效");
  const taxableIncome=Math.max(0,monthlyIncome-socialInsurance-specialDeduction-5000);
  const bracket=TAX_BRACKETS.find(item=>taxableIncome<=item.limit)||TAX_BRACKETS[TAX_BRACKETS.length-1];
  const tax=taxableIncome*bracket.rate-bracket.deduction;
  const payableTax=roundMoney(Math.max(0,tax));
  const afterTaxIncome=roundMoney(Math.max(0,monthlyIncome-socialInsurance-payableTax));
  /* R9-01：年终奖单独计税（全年一次性奖金 ÷12 查月度税率表） */
  const bonusBracket=TAX_BRACKETS.find(item=>yearEndBonus/12<=item.limit)||TAX_BRACKETS[TAX_BRACKETS.length-1];
  const bonusTax=roundMoney(Math.max(0,yearEndBonus*bonusBracket.rate-bonusBracket.deduction));
  const bonusAfterTax=roundMoney(Math.max(0,yearEndBonus-bonusTax));
  return {taxableIncome:roundMoney(taxableIncome),payableTax,afterTaxIncome,bonusTax,bonusAfterTax};
}

    const q=S.q.trim().toLowerCase();
    list=list.filter(it=>it.name.toLowerCase().includes(q));
  }
  return list;
}

/* 搜索时把匹配字符标红；转义后再包 <mark> */
function hl(name){
  const q=S.q.trim();   /* 收起搜索框后仍保留关键词与高亮（§38） */
  if(!q) return esc(name);
  const i=name.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(name);
  return esc(name.slice(0,i))+`<mark class="hl">${esc(name.slice(i,i+q.length))}</mark>`+esc(name.slice(i+q.length));
}
const showNames=()=>S.showNames||!!S.q.trim();
function tileHTML(it, selecting){
  const selected=S.sel.has(it.id);
  const mark=`<span class="mark">${ic("tick")}</span>`; /* 常驻，CSS 控制显隐 */
  const selc=S.select&&selected?" sel":"";
  if(it.doc){
    return `<button type="button" class="cell${selc}" data-id="${it.id}"><div class="tile doc"><div class="dt">${hl(it.name)}</div><div class="dl" style="width:92%"></div><div class="dl" style="width:78%"></div><div class="dl" style="width:85%"></div><div class="dl" style="width:50%"></div><span class="dic">${ic("filetext")}</span>${mark}</div>${showNames()?`<div class="tname">${hl(it.name)}</div>`:""}</button>`;
  }
  return `<button type="button" class="cell${selc}" data-id="${it.id}"><div class="tile${it.video?" video":""}" style="background-image:${photo(it.seed,it.kind)}">${it.video?`<span class="dur"><svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>${it.dur}</span>`:""}${mark}</div>${showNames()?`<div class="tname">${hl(it.name)}</div>`:""}</button>`;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function folderCover(f){
  if(!f.s.length) return `<div class="fcover empty"><div>${ic("folder")}</div></div>`;
  return `<div class="fcover">${f.s.map((s,k)=>`<div style="background-image:${photo(s,kinds[k%3])}"></div>`).join("")}</div>`;
}

/* 原地多选的选择条（覆盖在 Tab 栏上方，不参与布局） */
/* 出现：从 Tab 栏后方滑入 + 淡入；消失：反向。内容区底部始终预留选择条高度，所以不引起网格位移（§25/§27） */
function renderSelbar(instant){
  const sb=document.getElementById("a-sel");
  const root=document.getElementById("v-album");
  const ctx=curCtx();
  const want=S.select&&ctx!=="settings"&&!S.doc;
  if(!want){
    root.classList.remove("selmode");
    if(sb.classList.contains("hiding")&&!instant) return;   /* 退出动画进行中（如与搜索同时进行时的重渲染）：不打断 */
    clearTimeout(sb._t);
    if(instant||sb.hidden||!sb.classList.contains("show")){ sb.classList.remove("show","hiding"); sb.hidden=true; return; }
    sb.classList.add("hiding"); sb.classList.remove("show");
    sb._t=setTimeout(()=>{ sb.hidden=true; sb.classList.remove("hiding"); },320);
    return;
  }
  clearTimeout(sb._t); sb.classList.remove("hiding");
  if(want){
    const n=S.sel.size, dis=n?"":"disabled";
    const total=selectableIds().length;
    const state=n===0?"none":(n>=total&&total>0?"all":"some");
    const b=(act,icon,label,danger,d)=>`<button type="button" class="sbtn${danger?" danger":""}" data-act="${act}" ${d===undefined?dis:d}>${ic(icon)}<span>${label}</span></button>`;
    const ren=b("sel-rename","pen","重命名",0,n===1?"":"disabled");
    /* R9-02：全选 / 取消全选单按钮，三态 none/some/all 只区分是否已全选；全集为空时禁用 */
    const tog=b("sel-toggle-all",state==="all"?"selnone":"selall",state==="all"?"取消全选":"全选",0,total?"":"disabled");
    const acts= tog + (ctx==="trash" ? b("sel-restore","restore","恢复")+b("sel-purge","trash","删除",1)
              : ctx==="folders" ? ren+b("sel-export","share","导出")+b("sel-del","trash","删除",1)
              : ctx==="folder" ? b("sel-addf","folderplus","加入文件夹")+b("sel-out","folderminus","移出")+ren+b("sel-export","share","导出")+b("sel-del","trash","删除",1)
              : b("sel-addf","folderplus","加入文件夹")+ren+b("sel-export","share","导出")+b("sel-del","trash","删除",1));
    /* R9-03：「已选 N 项」为纯文字（不再可点、无 ‹） */
    sb.innerHTML=`<span class="sc">已选 <b>${n}</b> 项</span><div class="sacts">${acts}</div>`;
    const wasShown=!sb.hidden&&sb.classList.contains("show");
    sb.className="selbar"+(S.folder?" last":"")+(wasShown?" show":"");
    sb.hidden=false; root.classList.add("selmode");
    if(!wasShown){ void sb.offsetWidth; sb.classList.add("show"); }
  }
}
function selectableIds(){
  const ctx=curCtx();
  if(ctx==="photos") return filteredItems().map(it=>it.id);
  if(ctx==="folder") return folderItems().filter(it=>matchQ(it.name)&&matchF(it)).map(it=>it.id);
  if(ctx==="folders") return FOLDERS.filter(f=>matchQ(f.n)).map(f=>f.id);
  if(ctx==="trash") return TRASH.filter(t=>matchQ(t.name)&&matchF(t)).map(t=>t.id);
  return [];
}
/* 进入 / 退出多选：只切 class、更新顶栏按钮与选择条，不重建内容、不播放 FLIP（§25） */

function markSel(k,on){

function renderPlusLayer(opts, overlay, bar){

    if(!overlay.dataset.plusBuilt){
      overlay.innerHTML=`<div class="scrim" data-act="close-plus"></div>
        <div class="pop">
          <button type="button" data-act="add-photo">${ic("imgplus")}添加照片</button>
          <button type="button" data-act="add-doc">${ic("fileplus")}新建文档</button>
          <button type="button" data-act="add-folder">${ic("folderplus")}新建文件夹</button>
        </div>`;
      overlay.dataset.plusBuilt="1";
      overlay.classList.remove("is-open","closing");
      const fab=bar.querySelector(".fab");
      if(reopenPlus){   /* 从「新建文档」返回：菜单原样仍在，不重播弹出动画 */
        overlay.classList.add("noanim","is-open"); fab&&fab.classList.add("noanim","open");
        void overlay.offsetWidth; requestAnimationFrame(()=>{ overlay.classList.remove("noanim"); fab&&fab.classList.remove("noanim"); });
        bindAlbum(); return;
      }
      if(fab) fab.classList.remove("open");

  bindAlbum();
}

/* 长按约 450ms 进入原地多选，并选中该项（触摸与鼠标） */
const LP={timer:0,x:0,y:0,suppress:false};
function lpKey(el){
  const ctx=curCtx();
  if(el.dataset.id&&(ctx==="photos"||ctx==="folder")) return el.dataset.id;
  if(el.dataset.folder&&ctx==="folders") return el.dataset.folder;
  if(el.dataset.tid&&ctx==="trash") return el.dataset.tid;
  return null;
}
function bindLongPress(root){
  const cancel=()=>{ clearTimeout(LP.timer); LP.timer=0; };
  root.onpointerdown=function(e){
    if(S.select||e.button>0) return;
    const el=e.target.closest("[data-id],[data-folder],[data-tid]"); if(!el) return;
    const key=lpKey(el); if(!key) return;
    LP.x=e.clientX; LP.y=e.clientY; cancel();
    LP.timer=setTimeout(()=>{
      LP.timer=0; LP.suppress=true; LP.key=key; if(DS.track) DS.armed=true;
      try{ navigator.vibrate&&navigator.vibrate(8); }catch(_){}
      enterSelect([key]);
      const sel=`[data-id="${key}"],[data-folder="${key}"],[data-tid="${key}"]`;
      const n=document.querySelector("#a-body "+sel.split(",").join(",#a-body "));
      if(n&&!matchMedia("(prefers-reduced-motion: reduce)").matches) n.animate([{transform:"scale(1)"},{transform:"scale(.93)"},{transform:"scale(1)"}],{duration:220,easing:"ease-out"});
      setTimeout(()=>{ LP.suppress=false; },600);
    },450);
  };
  root.onpointermove=function(e){ if(LP.timer&&Math.hypot(e.clientX-LP.x,e.clientY-LP.y)>10) cancel(); };
  root.onpointerup=root.onpointercancel=root.onpointerleave=cancel;
  document.getElementById("a-body").onscroll=cancel;
  root.oncontextmenu=function(e){ if(e.target.closest(".cell,.fcard,.trow")) e.preventDefault(); };
}
/* 拖动多选（§28）：多选中横向起手拖动，或长按进入多选后不松手继续拖动；
   手指经过的每一项在本次拖动中反选一次；靠近上下边缘时内容区自动滚动；竖向起手 = 正常滚动 */
const DS={track:false,decided:false,on:false,armed:false,x0:0,y0:0,x:0,y:0,seen:new Set(),raf:0,mouse:false};
function dsKeyAt(x,y){
  const el=document.elementFromPoint(x,y); if(!el) return null;
  const t=el.closest("#a-body [data-id],#a-body [data-folder],#a-body [data-tid]");
  return t?lpKey(t):null;
}
function dsVisit(){
  const k=dsKeyAt(DS.x,DS.y);
  if(k&&!DS.seen.has(k)){ DS.seen.add(k); toggleSel(k); }

function dsEdges(){
  const body=document.getElementById("a-body"), r=body.getBoundingClientRect();
  let bottom=r.bottom;
  const sb=document.getElementById("a-sel"), bar=document.getElementById("a-bar");
  if(sb&&!sb.hidden) bottom=Math.min(bottom,sb.getBoundingClientRect().top);
  else if(bar&&!bar.hidden) bottom=Math.min(bottom,bar.getBoundingClientRect().top);
  const top=r.top+(parseFloat(getComputedStyle(body).getPropertyValue("--sbox-h"))||0);
  return {body,top,bottom};
}
function dsLoop(){
  if(!DS.on) return;
  const {body,top,bottom}=dsEdges(), E=64, MAX=16;
  let v=0;
  if(DS.y<top+E) v=-MAX*Math.min(1,(top+E-DS.y)/E);
  else if(DS.y>bottom-E) v=MAX*Math.min(1,(DS.y-(bottom-E))/E);
  if(v){ const before=body.scrollTop; body.scrollTop+=v; if(body.scrollTop!==before) dsVisit(); }
  DS.raf=requestAnimationFrame(dsLoop);
}
function dsStart(firstKeySeen){
  DS.on=true; DS.decided=true; clearTimeout(LP.timer); LP.timer=0;
  DS.seen=new Set(firstKeySeen?[firstKeySeen]:[]);
  if(!firstKeySeen){ const k0=dsKeyAt(DS.x0,DS.y0); if(k0){ DS.seen.add(k0); toggleSel(k0); } }
  dsVisit(); cancelAnimationFrame(DS.raf); DS.raf=requestAnimationFrame(dsLoop);
}
function dsEnd(){
  const was=DS.on&&DS.mouse;   /* 鼠标拖完会补发 click，需吞掉；触摸拖动不会产生 click */
  DS.on=false; DS.track=false; DS.armed=false; DS.decided=false; cancelAnimationFrame(DS.raf);
  if(was){ LP.suppress=true; setTimeout(()=>{ LP.suppress=false; },400); }
}
function dsMove(x,y,e){
  DS.x=x; DS.y=y;
  if(DS.on){ e.preventDefault(); dsVisit(); return; }
  if(DS.armed){ e.preventDefault(); dsStart(LP.key); return; }
  if(!S.select||DS.decided) return;
  const dx=x-DS.x0, dy=y-DS.y0;
  if(Math.hypot(dx,dy)<8) return;
  DS.decided=true;
  const onTile=!!dsKeyAt(DS.x0,DS.y0);
  if(onTile&&(DS.mouse||Math.abs(dx)>Math.abs(dy)*1.2)){ e.preventDefault(); dsStart(null); }
  else DS.track=false;   /* 竖向起手：交给浏览器滚动 */
}
function bindDragSelect(){
  const body=document.getElementById("a-body");

  body.addEventListener("touchstart",e=>{
    if(e.touches.length!==1){ dsEnd(); return; }
    const t=e.touches[0];
    /* 左缘交给 §60 右滑返回，不启动拖选跟踪 */
    if(t.clientX<=(typeof EB_EDGE==="number"?EB_EDGE:20)&&typeof edgeBackTarget==="function"&&edgeBackTarget()){ DS.track=false; return; }
    DS.track=true; DS.decided=false; DS.mouse=false; DS.armed=false;
    DS.x0=DS.x=t.clientX; DS.y0=DS.y=t.clientY;
  },{passive:true});
  body.addEventListener("touchmove",e=>{ if(!DS.track||e.touches.length!==1) return; const t=e.touches[0]; dsMove(t.clientX,t.clientY,e); },{passive:false});

  });

  window.addEventListener("pointerup",e=>{ if(e.pointerType==="mouse"&&DS.mouse) dsEnd(); });

/* FLIP：只用 transform / opacity；只动画视口内及附近的元素 */
const FLIP_SEL="[data-flip],[data-id],[data-folder],[data-tid]";
const flipKey=el=>el.dataset.flip||el.dataset.id||el.dataset.folder||el.dataset.tid;
function flipEls(body){ return [...body.querySelectorAll(FLIP_SEL)].filter(el=>{ if(el.closest(".flip-ghost")) return false; const a=el.parentElement.closest(FLIP_SEL); return !(a&&body.contains(a)); }); }
function refreshBody(){
  /* 只刷新内容区与筛选高亮，保留输入框焦点与展开状态 */
  const body=document.getElementById("a-body");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const br=body.getBoundingClientRect();
  const near=r=>r.bottom>br.top-120&&r.top<br.bottom+120;
  const before=new Map();
  if(!reduce) flipEls(body).forEach(el=>{ if(el.classList.contains("flip-ghost")) return; const r=el.getBoundingClientRect(); if(near(r)) before.set(flipKey(el),{el,r}); });
  body.innerHTML=buildBody(curCtx());
  if(!reduce){
    const seen=new Set();
    flipEls(body).forEach(el=>{
      const k=flipKey(el), o=before.get(k);
      if(o) seen.add(k);
      const r=el.getBoundingClientRect();
      if(!near(r)&&!(o&&near(o.r))) return;
      if(o){
        const dx=o.r.left-r.left, dy=o.r.top-r.top;
        if(dx||dy) el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"none"}],{duration:250,easing:"cubic-bezier(.2,.8,.2,1)",delay:40,fill:"backwards"});
      } else {
        el.animate([{opacity:0,transform:"scale(.85)"},{opacity:1,transform:"none"}],{duration:220,easing:"cubic-bezier(.2,.8,.2,1)",delay:60,fill:"backwards"});
      }
    });
    const br2=body.getBoundingClientRect();
    before.forEach((o,k)=>{
      if(seen.has(k)) return;
      const g=o.el.cloneNode(true); g.classList.add("flip-ghost");
      [g,...g.querySelectorAll(FLIP_SEL)].forEach(n=>["flip","id","folder","tid"].forEach(a=>n.removeAttribute("data-"+a)));
      Object.assign(g.style,{position:"absolute",left:(o.r.left-br2.left+body.scrollLeft)+"px",top:(o.r.top-br2.top+body.scrollTop)+"px",width:o.r.width+"px",height:o.r.height+"px",margin:"0",pointerEvents:"none",zIndex:"-1"});
      body.appendChild(g);
      g.animate([{opacity:1,transform:"none"},{opacity:0,transform:"scale(.85)"}],{duration:180,easing:"ease-in",fill:"forwards"}).onfinish=()=>g.remove();
    });
  }
  document.querySelectorAll("#sbox [data-filter]").forEach(b=>b.classList.toggle("on",b.dataset.filter===S.filter));

}

function buildBody(ctx){
  const names=showNames()?"names":"";

    let html="";
    /* 文件夹横条也参与搜索：每个文件夹单独做 FLIP（横条容器不设 data-flip） */
    const fl=S.filter==="all"?FOLDERS.filter(f=>matchQ(f.n)):[];   /* R9-04：文件夹横条只跟随「全部」与关键词 */
    const list=filteredItems();
    if(fl.length){
      html+=`<div class="sec" data-flip="sec-f"><h3>文件夹</h3><button type="button" data-act="goto-folders">全部 ${ic("chev")}</button></div>`;
      html+=`<div class="folders">${fl.map(f=>fcardHTML(f,false)).join("")}</div>`;
    }

      html+=`<div class="sec" data-flip="sec-r"><h3>${S.q.trim()?"文件":"全部文件"}</h3></div>`;
      html+=`<div class="grid ${names}">${list.map(it=>tileHTML(it,S.select)).join("")}</div>`;
    }
    if(!html) return (isFiltering()?emptySearch():emptyTrue("photos"))+pageEndHTML(ctx);

  }
  if(ctx==="folder"){
    const all=folderItems();
    const list=all.filter(it=>matchQ(it.name)&&matchF(it));
    if(!list.length) return (all.length||isFiltering()?emptySearch():emptyTrue("folder"))+pageEndHTML(ctx);

    if(S.sort==="count") list=[...list].sort((a,b)=>b.c-a.c);

    }).join("")}</div><p class="gf">项目将在剩余天数后被永久删除。本原型仅演示界面。</p></div>`+pageEndHTML(ctx);
  }

    return;
  }
  /* 收起：保留关键词与筛选结果（§38）；只有关键词为空时才把快捷筛选复位为「全部」，避免无角标的隐藏筛选 */
  const H=sboxH(), hadQuery=!S.q.trim()&&S.filter!=="all";
  S.search=false; if(!S.q.trim()) S.filter="all";
  const box=document.getElementById("sbox");
  const btn=document.querySelector('#a-nav [data-act="toggle-search"]');
  if(btn){ btn.classList.remove("on"); btn.setAttribute("aria-pressed","false"); }
  const q=document.getElementById("q"); q&&q.blur();
  if(hadQuery){ body.innerHTML=buildBody(curCtx()); body.scrollTop=H; if(S.select) S.sel.forEach(k=>markSel(k,true)); }
  box&&box.classList.remove("open");
  const st=body.scrollTop, shift=Math.max(0,H-st);
  body.classList.remove("reserve"); body.style.removeProperty("--sbox-h"); body.scrollTop=Math.max(0,st-H);
  /* 只有在列表顶部（scrollTop < 面板高度）时，内容会随面板收起同步上移，不是 FLIP */
  if(shift&&!reduce) [...body.children].forEach(el=>el.animate([{transform:`translateY(${shift}px)`},{transform:"none"}],{duration:360,easing:"cubic-bezier(.2,.8,.2,1)"}));
  setTimeout(()=>{ if(!S.search&&S.view==="album"&&!S.doc) render({keepBody:true}); },400);
}

/* 「＋ › 添加照片」打开系统选取器（§24）：选取器打开期间 + 保持按下（×）状态，
   直到 change / cancel、window focus / visibilitychange 回来或用户点任意处才复原。 */
const PICK={openedAt:0,endedAt:0,input:null,off:null};
let reopenPlus=false;
function startPicker(){
  const fab=document.querySelector("#a-bar .fab");
  if(PICK.input) PICK.input.remove();
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*,video/*"; inp.multiple=true; inp.className="picker-input"; inp.tabIndex=-1;
  if(fab){ const r=fab.getBoundingClientRect(); inp.style.left=r.left+"px"; inp.style.top=r.top+"px"; }
  document.body.appendChild(inp); PICK.input=inp;
  S.picking=true; PICK.openedAt=Date.now();
  const t=document.querySelector('#a-bar [data-act="plus"]'); t&&t.setAttribute("aria-expanded","true");
  const later=()=>{ if(Date.now()-PICK.openedAt>400) setTimeout(endPicker,350); };
  const onVis=()=>{ if(document.visibilityState==="visible") later(); };
  const onDown=(e)=>{ if(Date.now()-PICK.openedAt<300) return; endPicker(); };
  inp.addEventListener("change",()=>{ const files=inp.files?[...inp.files]:[]; endPicker(); if(files.length) demoImport(files); });
  inp.addEventListener("cancel",()=>endPicker());
  window.addEventListener("focus",later); document.addEventListener("visibilitychange",onVis); document.addEventListener("pointerdown",onDown,true);
  PICK.off=()=>{ window.removeEventListener("focus",later); document.removeEventListener("visibilitychange",onVis); document.removeEventListener("pointerdown",onDown,true); };
  inp.click();        /* 必须在点击手势内同步调用；菜单保持展开、+ 保持 ×（§24/§30） */
}
function endPicker(){
  if(!S.picking) return;
  S.picking=false; PICK.off&&PICK.off(); PICK.off=null;
  if(S.plus) return;   /* 菜单仍展开：+ 继续保持 × */
  const fab=document.querySelector("#a-bar .fab"); fab&&fab.classList.remove("open");
  const t=document.querySelector('#a-bar [data-act="plus"]'); t&&t.setAttribute("aria-expanded","false");
}
function closePlusMenu(after){
  const overlay=document.getElementById("a-overlay");
  const fab=document.querySelector("#a-bar .fab");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  S.plus=false;
  if(!overlay||!overlay.dataset.plusBuilt){ overlay&&(overlay.innerHTML=""); after&&after(); render(); return; }
  overlay.classList.add("closing");
  overlay.classList.remove("is-open");
  if(!S.picking) fab&&fab.classList.remove("open");
  const done=()=>{
    overlay.innerHTML="";
    delete overlay.dataset.plusBuilt;
    overlay.classList.remove("closing","is-open");
    after&&after();
    render();
  };
  if(reduce) done();
  else setTimeout(done, 220);
}

/* 外观滑块：点选 = 只移动选中块（不重建设置页，过渡才能播放）；按住选中块拖动 = 跟手，松手吸附最近一项 */
/* ===== 通用分段控件（§43）：页面里任何 .seg 都会被自动升级为滑块式——
   插入 .seg-thumb、按 button.on 设置 --i / --n；选中项（.on）无论被谁改变，滑块都会平滑滑过去；
   若整个控件被重新渲染，按上次位置（SEG_POS）从旧位置滑到新位置。 ===== */
const SEG_POS={};
function segKey(sg){ if(sg.id) return "#"+sg.id; if(sg.dataset.kind) return "k:"+sg.dataset.kind; const b=sg.querySelector("button"); return "a:"+(b?[...b.attributes].map(a=>a.name).filter(n=>n.startsWith("data-")).join(","):""); }
function segSync(sg){
  const bs=[...sg.querySelectorAll(":scope>button")]; if(!bs.length) return;
  if(!sg.classList.contains("slide")) sg.classList.add("slide");
  if(!sg.querySelector(":scope>.seg-thumb")){ const t=document.createElement("i"); t.className="seg-thumb"; t.setAttribute("aria-hidden","true"); sg.insertBefore(t,sg.firstChild); }
  const i=Math.max(0,bs.findIndex(b=>b.classList.contains("on"))), key=segKey(sg);
  sg.style.setProperty("--n",bs.length);
  if(!sg._segInit){
    sg._segInit=true;
    const prev=SEG_POS[key];
    if(prev!=null&&prev!==i&&prev<bs.length){ sg.style.setProperty("--i",prev); void sg.offsetWidth; }
  }
  if(sg.style.getPropertyValue("--i")!==String(i)) sg.style.setProperty("--i",i);
  SEG_POS[key]=i;
}
function segScan(root){ (root.querySelectorAll?root:document).querySelectorAll(".seg").forEach(segSync); }
(function(){
  const mo=new MutationObserver(ms=>{
    const set=new Set();
    ms.forEach(m=>{
      if(m.type==="attributes"){ const sg=m.target.parentElement; if(sg&&sg.classList.contains("seg")) set.add(sg); return; }
      m.addedNodes.forEach(n=>{ if(n.nodeType!==1) return; if(n.classList.contains("seg")) set.add(n); n.querySelectorAll&&n.querySelectorAll(".seg").forEach(x=>set.add(x)); });
    });
    set.forEach(segSync);
  });
  const start=()=>{ segScan(document); mo.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:["class"]}); bindSegDrag(); };
  if(document.body) start(); else document.addEventListener("DOMContentLoaded",start);
})();
function segSelect(sg,i){
  const bs=[...sg.querySelectorAll("button")]; if(!bs[i]) return;
  bs.forEach((b,k)=>b.classList.toggle("on",k===i));
  sg.style.setProperty("--i",i);
  const v=bs[i].dataset.themeSet, kind=sg.dataset.kind||"album";
  if((kind==="calc"?S.calcPref:S.albumPref)!==v) setThemePref(kind,v);
}
const SEGD={sg:null,x0:0,i0:0,w:0,moved:false,id:null};
function bindSegDrag(){
  if(document._segd) return; document._segd=true;
  document.addEventListener("pointerdown",e=>{
    const sg=e.target.closest&&e.target.closest(".seg.slide"); if(!sg||e.button>0) return;
    const bs=[...sg.querySelectorAll("button")], i0=bs.findIndex(b=>b.classList.contains("on"));
    if(e.target.closest("button")!==bs[i0]) return;   /* 只有按在选中块上才拖动 */
    Object.assign(SEGD,{sg,x0:e.clientX,i0,w:bs[0].getBoundingClientRect().width+2,moved:false,id:e.pointerId});
  },true);
  document.addEventListener("pointermove",e=>{
    const d=SEGD; if(!d.sg||e.pointerId!==d.id) return;
    const dx=e.clientX-d.x0; if(!d.moved&&Math.abs(dx)<6) return;
    if(!d.moved){ d.moved=true; d.sg.classList.add("dragging"); try{d.sg.setPointerCapture(e.pointerId)}catch(_){} }
    const n=d.sg.querySelectorAll("button").length, px=Math.max(0,Math.min((n-1)*d.w,d.i0*d.w+dx));
    d.sg.style.setProperty("--dx",px+"px");
    const near=Math.round(px/d.w); d.sg.querySelectorAll("button").forEach((b,k)=>b.classList.toggle("on",k===near));
  },true);
  const up=e=>{
    const d=SEGD; if(!d.sg||e.pointerId!==d.id) return;
    const sg=d.sg; d.sg=null;
    if(!d.moved) return;
    const near=[...sg.querySelectorAll("button")].findIndex(b=>b.classList.contains("on"));
    sg.style.setProperty("--i",near);
    const nb=sg.querySelectorAll("button")[near];
    SEG_POS[segKey(sg)]=near;
    if(nb&&nb.dataset.themeSet!==undefined) requestAnimationFrame(()=>{ sg.classList.remove("dragging"); segSelect(sg,near); });
    else { requestAnimationFrame(()=>sg.classList.remove("dragging")); SEGD.prog=true; nb&&nb.click(); SEGD.prog=false; }
    SEGD.swallow=Date.now();
  };
  document.addEventListener("pointerup",up,true); document.addEventListener("pointercancel",up,true);
  document.addEventListener("click",e=>{ if(!SEGD.prog&&SEGD.swallow&&Date.now()-SEGD.swallow<350&&e.target.closest&&e.target.closest(".seg.slide")){ e.stopPropagation(); e.preventDefault(); SEGD.swallow=0; } },true);
}

/* §60 左缘右滑返回（iOS 风格）：起点在左缘 ~20px，右滑达阈值或速度阈值后执行与点 ‹ 相同动作。
   非长按后滑动；对话框/进度遮罩打开时不触发；中屏横向拖仍留给多选拖选。
   相册内子页（文件夹/设置子页/文档）与 ‹ 共用 navBack*，且禁止跟手平移 #v-album——
   整壳滑走会露底（虚空/计算器伪装），表现为「右滑退出到计算器封面」。仅查看器浮层可跟手滑出。 */
function navBackFolder(){ S.folder=null; resetModes(); render(); }
function navBackSub(){ S.sub=null; render(); }
function navBackDoc(){ S.doc=null; if(S.plusResume){ S.plusResume=false; S.plus=true; reopenPlus=true; } render(); reopenPlus=false; }
function navBackViewer(viewer){
  const v=viewer||document.querySelector("#layer>.viewer"); if(!v) return;
  const b=v.querySelector('[data-x="back"]');
  if(b) b.click();
  else { try{v._player&&v._player.destroy()}catch(_){} v.remove(); }
}
const EB={on:false,id:null,x0:0,y0:0,t0:0,dx:0,panel:null,act:null,moved:false};
const EB_EDGE=20, EB_ARM=8, EB_COMMIT=56, EB_VEL=0.45;
function edgeBackBlocked(){
  return !!document.querySelector(".dlg-back.show");
}
function edgeBackTarget(){
  if(S.view!=="album") return null;
  if(edgeBackBlocked()) return null;
  const viewer=document.querySelector("#layer>.viewer");
  if(viewer) return {el:viewer, act:()=>navBackViewer(viewer)};
  /* el:null → 不跟手平移 #v-album（避免整壳滑出露计算器底）；act 与顶栏 ‹ 同函数 */
  if(S.doc) return {el:null, act:navBackDoc};
  if(S.sub) return {el:null, act:navBackSub};
  if(S.folder) return {el:null, act:navBackFolder};
  return null;
}
function ebResetVisual(el){
  if(!el) return;
  el.classList.remove("edge-back-dragging");
  el.style.transition=""; el.style.transform=""; el.style.opacity=""; el.style.boxShadow="";
}
function ebFollow(el,dx){
  if(!el) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const x=Math.max(0,dx);
  el.classList.add("edge-back-dragging");
  el.style.transition="none";
  el.style.transform="translate3d("+x+"px,0,0)";
  el.style.opacity=String(Math.max(0.55, 1-x/420));
}
function bindEdgeBack(){
  if(document._eb) return; document._eb=true;
  document.addEventListener("pointerdown",e=>{
    if(EB.on) return;
    if(e.button>0) return;
    if(e.clientX>EB_EDGE) return;
    if(e.target.closest&&e.target.closest("input,textarea,[contenteditable],.dlg-back,.plyr__controls,.plyr__menu")) return;
    const t=edgeBackTarget(); if(!t) return; /* el 可为 null（相册内子页无跟手壳） */
    EB.on=true; EB.id=e.pointerId; EB.x0=e.clientX; EB.y0=e.clientY; EB.t0=performance.now();
    EB.dx=0; EB.panel=t.el||null; EB.act=t.act; EB.moved=false;
    clearTimeout(LP.timer); LP.timer=0;
    DS.track=false; DS.armed=false; /* 左缘不交给拖选 */
  },{capture:true,passive:true});
  document.addEventListener("pointermove",e=>{
    if(!EB.on||e.pointerId!==EB.id) return;
    if(edgeBackBlocked()){ ebCancel(); return; }
    const dx=e.clientX-EB.x0, dy=e.clientY-EB.y0;
    if(!EB.moved){
      if(Math.hypot(dx,dy)<EB_ARM) return;
      if(Math.abs(dy)>Math.abs(dx)*1.15 || dx<=2){ ebCancel(); return; } /* 竖滑/左滑放弃 */
      EB.moved=true;
      try{ document.body.setPointerCapture(e.pointerId); }catch(_){}
    }
    EB.dx=Math.max(0,dx);
    if(e.cancelable) e.preventDefault();
    ebFollow(EB.panel, EB.dx);
  },{capture:true,passive:false});
  function ebCancel(){
    const panel=EB.panel, moved=EB.moved;
    EB.on=false; EB.id=null; EB.act=null;
    if(panel&&moved){
      panel.style.transition="transform .22s cubic-bezier(.2,.9,.3,1), opacity .22s ease";
      panel.style.transform=""; panel.style.opacity="";
      setTimeout(()=>ebResetVisual(panel),240);
    } else ebResetVisual(panel);
    EB.panel=null; EB.moved=false;
  }
  function ebEnd(e){
    if(!EB.on||(e&&e.pointerId!=null&&e.pointerId!==EB.id)) return;
    const dt=Math.max(1, performance.now()-EB.t0);
    const vel=EB.dx/dt;
    const commit=EB.moved && (EB.dx>=EB_COMMIT || (EB.dx>28 && vel>=EB_VEL));
    const panel=EB.panel, act=EB.act, moved=EB.moved;
    EB.on=false; EB.id=null; EB.panel=null; EB.act=null; EB.moved=false;
    if(!commit){
      if(panel&&moved){
        panel.style.transition="transform .22s cubic-bezier(.2,.9,.3,1), opacity .22s ease";
        panel.style.transform=""; panel.style.opacity="";
        setTimeout(()=>ebResetVisual(panel),240);
      } else ebResetVisual(panel);
      return;
    }
    const finish=()=>{ ebResetVisual(panel); try{ act&&act(); }catch(_){} };
    if(panel&&moved&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
      const w=Math.max(panel.clientWidth||innerWidth, 280);
      panel.style.transition="transform .18s ease-out, opacity .18s ease-out";
      panel.style.transform="translate3d("+Math.max(EB.dx, w*0.42)+"px,0,0)";
      panel.style.opacity="0.3";
      setTimeout(finish,170);
    } else finish();
  }
  document.addEventListener("pointerup",ebEnd,{capture:true});
  document.addEventListener("pointercancel",ebEnd,{capture:true});
  window.__edgeBack={EB, edgeBackTarget, edgeBackBlocked, EB_EDGE, EB_COMMIT, navBackFolder, navBackSub, navBackDoc}; /* 验收用 */
}

function bindAlbum(){
  bindSegDrag();
  const root=document.getElementById("v-album");
  root.onclick=function(e){
    if(LP.suppress){ LP.suppress=false; e.preventDefault(); e.stopPropagation(); return; }
    /* 多选中点文件区域以外的地方 = 退出多选（§42）。例外：顶栏按钮、多选栏、Tab 栏、＋菜单、弹窗 */
    if(S.select&&!S.doc&&curCtx()!=="settings"){
      const ctx=curCtx();
      const inBody=e.target.closest("#a-body"), inNav=e.target.closest("#a-nav");
      const isTile=e.target.closest(ctx==="folders"?"#a-body [data-folder]":ctx==="trash"?"#a-body [data-tid]":"#a-body .grid [data-id]");
      const isPageEnd=e.target.closest(".page-end");
      if((inBody&&!isTile&&!isPageEnd)||(inNav&&!e.target.closest("button,input,#sbox"))){ e.preventDefault(); e.stopPropagation(); exitSelect(); return; }
    }
    const rt=e.target.closest("[data-ret]");
    if(rt){ S.retention=rt.dataset.ret; render(); return; }
    const t=e.target.closest("[data-act],[data-tab],[data-theme-set],[data-filter],[data-sort],[data-folder],[data-id],[data-tid],[data-restore],[data-purge]");
    if(!t) return;
    if(t.dataset.themeSet!==undefined){ const sg=t.closest(".seg.slide"); if(sg){ segSelect(sg,[...sg.querySelectorAll("button")].indexOf(t)); return; } setThemePref(t.dataset.kind||"album", t.dataset.themeSet); render(); return; }
    if(t.dataset.tab){ S.tab=t.dataset.tab; S.plus=false; S.folder=null; S.sub=null; resetModes(); render(); return; }
    if(t.dataset.filter){ S.filter=t.dataset.filter; refreshBody(); return; }
    if(t.dataset.sort){ S.sort=t.dataset.sort; refreshBody(); return; }
    if(t.dataset.folder){
      if(S.select&&curCtx()==="folders"){ toggleSel(t.dataset.folder); return; }
      S.folder=t.dataset.folder; S.plus=false; resetModes(); render(); return;
    }
    if(t.dataset.tid){ if(S.select) toggleSel(t.dataset.tid); return; }
    if(t.dataset.restore){
      const id=t.dataset.restore;
      const item=TRASH.find(x=>x.id===id);
      if(item){ TRASH=TRASH.filter(x=>x.id!==id); toast("已恢复"); render(); }
      return;
    }
    if(t.dataset.purge){
      const id=t.dataset.purge;
      dialog({title:"永久删除？", text:"删除后无法恢复", ok:"删除", danger:true, onOk:()=>{
        TRASH=TRASH.filter(x=>x.id!==id); render(); toast("已删除");
      }});
      return;
    }
    if(t.dataset.id){
      const id=t.dataset.id;
      if(S.select){ toggleSel(id); } else {
        const it=ITEMS.find(x=>x.id===id);
        if(it&&it.doc) openDoc(id,"view"); else openViewer(id);
      }
      return;
    }
    const act=t.dataset.act;
    if(!act) return;
    if(act==="lock"){ lock(); return; }
    if(act==="back"){ S.tab="photos"; render(); return; }
    if(act==="doc-back"){ navBackDoc(); return; }
    if(act==="doc-edit"){ S.doc.mode="edit"; render(); return; }
    if(act==="doc-done"){ S.doc.mode="view"; S.doc.sheet=false; S.doc.isNew=false; toast("已保存"); render(); return; }
    if(act==="doc-aa"){ S.doc.sheet=!S.doc.sheet; render(); return; }
    if(act==="open-pin"){ S.sub="pin"; render(); return; }
    if(act==="ver-cycle"){ VER.st=1; VER.failOnce=true; render({keepScroll:true}); return; }
    if(act==="ver-retry"){ VER.st=2; render({keepScroll:true});
      clearTimeout(VER.timer); VER.timer=setTimeout(()=>{ VER.cur=VER.next; VER.next=VER.next.replace(/\d+$/,m=>+m+1); VER.st=0; VER.failOnce=false; if(S.view==="album"&&S.tab==="settings"&&!S.sub) render({keepScroll:true}); toast(`已更新到 ${VER.cur}`); },2200);
      return; }
    if(act==="ver-update"){ dialog({title:`更新到 ${VER.next}？`, text:"只更新应用本身，相册中的文件、文件夹与设置都不受影响。更新需要几秒钟，完成后会自动重新打开。", ok:"更新", onOk:()=>{
        VER.st=2; render({keepScroll:true});
        clearTimeout(VER.timer); VER.timer=setTimeout(()=>{
          if(VER.failOnce!==false){ VER.st=3; VER.failOnce=false; if(S.view==="album"&&S.tab==="settings"&&!S.sub) render({keepScroll:true}); toast("更新失败，已保留原版本"); return; }
          VER.cur=VER.next; VER.next=VER.next.replace(/\d+$/,m=>+m+1); VER.st=0; if(S.view==="album"&&S.tab==="settings"&&!S.sub) render({keepScroll:true}); toast(`已更新到 ${VER.cur}`);
        },2600);
      }}); return; }
    if(act==="clear-all"){
      dialog({title:"清空全部数据？", text:"将永久删除本机全部文件、文件夹与回收站内容，且无法恢复。此操作与紧急清除码无关。", ok:"清空", danger:true, onOk:()=>{
        ITEMS.length=0; TRASH.length=0; FOLDERS.forEach(f=>{ f.c=0; f.s=[]; }); Object.keys(MEMB).forEach(k=>delete MEMB[k]); FD_OUT.clear();
        S.select=false; S.sel=new Set(); S.folder=null; S.q=""; S.filter="all";
        render(); toast("已清空全部数据");
      }}); return; }
    if(act==="toggle-page-end"){ S.pageEnd=S.pageEnd==="loading"?"done":"loading"; refreshBody(); return; }
    if(act==="sel-toggle-all"){ const ids=selectableIds(); S.sel=(ids.length&&S.sel.size>=ids.length)?new Set():new Set(ids); applySelect(); return; }
    if(act==="open-retention"){ S.sub="retention"; render(); return; }
    if(act==="empty-trash"){
      const n=TRASH.length; if(!n) return;
      dialog({title:"清空回收站？", text:`将永久删除全部 ${n} 个文件，无法恢复`, ok:"清空", danger:true, onOk:()=>{ TRASH=[]; S.select=false; S.sel=new Set(); render(); toast("已清空"); }});
      return;
    }
    if(act==="open-wipe"){ verifyUnlockPin(()=>{ S.sub="wipe"; render(); }); return; }
    if(act==="save-wipe"){ verifyUnlockPin(()=>{ toast("紧急清除码已保存"); S.sub=null; render(); }); return; }
    if(act==="back-sub"){ navBackSub(); return; }
    if(act==="rename-folder"){ renameFolder(S.folder); return; }
    if(act==="back-folder"){ navBackFolder(); return; }
    /* 搜索与多选互斥，切换时两个动画同时进行（§39 第四轮修订） */
    if(act==="toggle-search"){ if(!S.search&&S.select) exitSelect(); toggleSearch(); return; }
    if(act==="clear-q"){ S.q=""; const q=document.getElementById("q"); if(q){ q.value=""; q.focus(); } const c=document.querySelector("#sbox .clr"); if(c) c.classList.remove("show"); updSearchDot(); refreshBody(); return; }
    if(act==="toggle-select"){
      if(!S.select){ enterSelect(); return; }
      S.select=false; S.sel=new Set(); if(S.plus) closePlusMenu(); applySelect(); return; }
    if(act==="sel-rename"){
      if(S.sel.size!==1) return;
      const id=[...S.sel][0], ctx=curCtx();
      if(ctx==="folders"){ renameFolder(id); return; }
      if(ctx==="folder"){
        const it=folderItems().find(x=>x.id===id); if(!it) return;
        prompt2("重命名", it.name, ".jpg", v=>{ if(!v.trim()) return "名称不能为空"; RENAMED[S.folder+"/"+id]=v.trim(); render(); toast("已重命名"); });
        return;
      }
      renameSelected(id); return;
    }
    if(act==="sel-export"){ if(S.sel.size) demoExport(); return; }
    if(act==="sel-addf"){ if(S.sel.size) openFolderPicker(); return; }
    if(act==="sel-out"){
      const n=S.sel.size, f=FOLDERS.find(x=>x.id===S.folder); if(!n||!f) return;
      dialog({title:`从「${f.n}」移出 ${n} 项？`, text:"只移出此文件夹，文件不会被删除，仍可在首页和其他文件夹中找到", ok:"移出", onOk:()=>{
        S.sel.forEach(id=>{ FD_OUT.add(S.folder+"/"+id); memOf(id).delete(S.folder); });
        syncFolderCount(S.folder); S.sel=new Set(); render(); toast(`已移出 ${n} 项`);
      }});
      return;
    }
    if(act==="sel-del"){
      if(curCtx()==="photos"){ const n=S.sel.size; if(!n) return;
        dialog({title:`删除 ${n} 项？`, text:`将移入回收站，${S.retention==="never"?"可随时":S.retention+" 天内可"}恢复`, ok:"删除", danger:true, onOk:()=>deleteSelected()});
        return; }
      const n=S.sel.size;
      dialog({title:curCtx()==="folders"?`删除 ${n} 个文件夹？`:`删除 ${n} 项？`, text:curCtx()==="folders"?"只删除文件夹，里面的文件仍保留在首页和其他文件夹中，不会进回收站":`将移入回收站，${S.retention==="never"?"可随时":S.retention+" 天内可"}恢复`, ok:"删除", danger:true, onOk:()=>{ S.sel=new Set(); render(); toast("已删除"); }});
      return;
    }
    if(act==="sel-restore"){ TRASH=TRASH.filter(x=>!S.sel.has(x.id)); S.sel=new Set(); render(); toast("已恢复"); return; }
    if(act==="sel-purge"){
      const n=S.sel.size;
      dialog({title:`永久删除 ${n} 项？`, text:"删除后无法恢复", ok:"删除", danger:true, onOk:()=>{ TRASH=TRASH.filter(x=>!S.sel.has(x.id)); S.sel=new Set(); render(); toast("已删除"); }});
      return;
    }
    if(act==="plus"){ if(S.picking) endPicker(); if(S.plus) closePlusMenu(); else { S.plus=true; render(); } return; }
    /* 菜单内三个按钮都不收起菜单（§30）：只有点遮罩或再点 × 才收起 */
    if(act==="add-photo"){ startPicker(); return; }
    if(act==="close-plus"){ closePlusMenu(); return; }
    if(act==="add-folder"){ dialog({title:"新建文件夹", input:{value:"", placeholder:"文件夹名称"}, ok:"创建", onOk:(v)=>{
        if(!v.trim()) return "名称不能为空";
        FOLDERS.push({id:"f"+Date.now(),n:v.trim(),c:0,s:[]}); render({keepBody:false}); toast("已创建");
      }}); return; }
    if(act==="add-doc"){ S.plusResume=true; S.plus=false; S.doc={id:null,title:"",isNew:true,mode:"edit",sheet:false}; render(); document.getElementById("a-body").scrollTop=0; return; }
    if(act==="goto-folders"){ S.tab="folders"; render(); return; }
    if(act==="toggle-names"){ S.showNames=!S.showNames; render(); return; }
    if(act==="share"||act==="move"){ toast("演示：功能占位"); return; }
    if(act==="noop"){ toast("演示：功能占位"); return; }
  };
  bindLongPress(root);
  bindDragSelect();
  bindEdgeBack();
  const q=document.getElementById("q");
  if(q){
    q.oninput=function(){ S.q=q.value; const c=document.querySelector("#sbox .clr"); if(c) c.classList.toggle("show",!!S.q); updSearchDot(); refreshBody(); };
  }
}

function splitName(name){
  const i=name.lastIndexOf(".");
  if(i>0) return {base:name.slice(0,i), ext:name.slice(i)};
  return {base:name, ext:""};
}

function renameFolder(id){
  const f=FOLDERS.find(x=>x.id===id); if(!f) return;
  dialog({title:"重命名文件夹", input:{value:f.n}, ok:"确定", onOk:(v)=>{
    if(!v.trim()) return "名称不能为空";
    f.n=v.trim(); render(); toast("已重命名");
  }});
}
function renameSelected(id){
  const it=ITEMS.find(x=>x.id===id)||null;
  if(!it) return;
  const {base,ext}=splitName(it.name);
  prompt2("重命名", base, ext, (val)=>{
    if(!val.trim()) return "名称不能为空";
    it.name=val.trim()+ext;
    toast("已重命名");
    render();
    return true;
  });
}

function deleteSelected(){
  const ids=[...S.sel];
  ids.forEach(id=>{
    const it=ITEMS.find(x=>x.id===id);
    if(!it) return;
    it.trash=true;
    TRASH.unshift({id:"tr_"+id, name:it.name+(it.doc?".txt":it.video?".mp4":".jpg"), days:30, seed:it.seed||1, kind:it.kind||"land", doc:!!it.doc, video:!!it.video});
  });
  S.sel=new Set();
  toast("已移入回收站");
  render();
}

/* 统一对话框组件。opts: {title, text?, input?:{value, suffix?, placeholder?}, cancel?="取消", ok?="确定", danger?, onOk(value)}

function verifyUnlockPin(onPass){

function dialog(opts){
  const layer=document.getElementById("layer");
  const wrap=document.createElement("div");
  wrap.className="dlg-back";
  const inp=opts.input;
  const itype=inp&&inp.type?inp.type:"text";
  const iattrs=inp?` type="${esc(itype)}" value="${esc(inp.value||"")}" placeholder="${esc(inp.placeholder||"")}" autocomplete="${esc(inp.autocomplete||"off")}"${inp.inputmode?` inputmode="${esc(inp.inputmode)}"`:""}${inp.pattern?` pattern="${esc(inp.pattern)}"`:""}${inp.maxlength?` maxlength="${esc(String(inp.maxlength))}"`:""}`:"";
  wrap.innerHTML=`<div class="dlg${inp?"":" noinput"}" role="alertdialog" aria-modal="true"><h4>${esc(opts.title)}</h4>
    ${opts.text?`<p>${esc(opts.text)}</p>`:""}
    ${inp?`<div class="din"><input id="dlg-in"${iattrs}>${inp.suffix?`<span>${esc(inp.suffix)}</span>`:""}</div>
    <div class="derr" id="dlg-err"></div>`:""}
    <div class="dbtns"><button type="button" data-x="c">${esc(opts.cancel||"取消")}</button><button type="button" data-x="o" class="${opts.danger?"danger":""}">${esc(opts.ok||"确定")}</button></div></div>`;
  layer.appendChild(wrap);
  requestAnimationFrame(()=>requestAnimationFrame(()=>wrap.classList.add("show")));
  const el=wrap.querySelector("#dlg-in");
  if(el){ el.focus(); el.select(); }
  const close=()=>{ wrap.style.pointerEvents="none"; wrap.classList.remove("show"); setTimeout(()=>wrap.remove(),180); };
  /* 点遮罩（按下与松开都在遮罩上）= 取消（§45）；叠放时只关闭最上层 */
  let downOnBack=false;
  wrap.onpointerdown=e=>{ downOnBack=e.target===wrap; };
  wrap.onclick=(e)=>{
    if(e.target===wrap){ if(downOnBack) close(); downOnBack=false; return; }
    const b=e.target.closest("[data-x]");
    if(!b) return;
    if(b.dataset.x==="c"){ close(); return; }
    const r=opts.onOk?opts.onOk(el?el.value:undefined):undefined;
    if(typeof r==="string"){ const er=wrap.querySelector("#dlg-err"); if(er) er.textContent=r; else toast(r); return; }
    close();
  };
  return wrap;
}
/* 「加入文件夹」选择框（§31）：屏幕正中固定尺寸弹窗，动画同 dialog；多选（含半选态）、框内滚动、可展开搜索、顶部「新建文件夹」 */
function openFolderPicker(){
  const ids=[...S.sel], n=ids.length;
  const init={};   /* folderId -> "all" | "some" | "none" */
  FOLDERS.forEach(f=>{ const k=ids.filter(id=>memOf(id).has(f.id)).length; init[f.id]=k===0?"none":k===n?"all":"some"; });
  const cur=Object.assign({},init);
  let q="", searchOpen=false;
  const layer=document.getElementById("layer");
  const wrap=document.createElement("div");
  wrap.className="dlg-back fp-back";
  wrap.innerHTML=`<div class="dlg fpk" role="dialog" aria-modal="true" aria-labelledby="fp-t">
    <div class="fp-head"><div class="fp-tt"><h4 id="fp-t">加入文件夹</h4><small>已选 ${n} 项 · 可多选</small></div>
      <button type="button" class="fp-sbtn" data-x="s" aria-label="搜索文件夹" aria-expanded="false">${ic("search")}<i class="sdot" aria-hidden="true"></i></button></div>
    <div class="fp-sbox"><div><div class="field">${ic("search")}<input id="fp-q" type="search" placeholder="搜索文件夹" autocomplete="off" enterkeyhint="search"><button type="button" class="clr" data-x="clr" aria-label="清除"><span>${ic("x")}</span></button></div></div></div>
    <div class="fp-list" id="fp-list"></div>
    <div class="dbtns"><button type="button" data-x="c">取消</button><button type="button" data-x="o">确认</button></div></div>`;
  layer.appendChild(wrap);
  const list=wrap.querySelector("#fp-list"), inp=wrap.querySelector("#fp-q"), clr=wrap.querySelector(".clr");
  const fhl=name=>{ const t=q.trim(); if(!t) return esc(name); const i=name.toLowerCase().indexOf(t.toLowerCase()); if(i<0) return esc(name); return esc(name.slice(0,i))+`<mark class="hl">${esc(name.slice(i,i+t.length))}</mark>`+esc(name.slice(i+t.length)); };
  const thumb=f=>f.s.length?`<span class="fp-th" style="background-image:${photo(f.s[0],"land")}"></span>`:`<span class="fp-th empty">${ic("folder")}</span>`;
  const draw=()=>{
    const t=q.trim().toLowerCase();
    const rows=FOLDERS.filter(f=>!t||f.n.toLowerCase().includes(t));
    list.innerHTML=(t?"":`<button type="button" class="fp-row fp-new" data-x="new"><span class="fp-th add">${ic("plus")}</span><span class="fp-n">新建文件夹</span></button>`)+
      rows.map(f=>{ const st=cur[f.id];
        return `<button type="button" class="fp-row" data-f="${f.id}" role="checkbox" aria-checked="${st==="all"?"true":st==="some"?"mixed":"false"}">${thumb(f)}<span class="fp-n"><b>${fhl(f.n)}</b><small>${f.c} 项${f.id===S.folder?" · 当前文件夹":""}</small></span><span class="fp-ck ${st}">${st==="all"?ic("tick"):st==="some"?"<i></i>":""}</span></button>`; }).join("")+
      (t&&!rows.length?`<div class="fp-empty">没有匹配「${esc(q.trim())}」的文件夹</div>`:"");
  };
  draw();
  requestAnimationFrame(()=>requestAnimationFrame(()=>wrap.classList.add("show")));
  const close=()=>{ wrap.style.pointerEvents="none"; wrap.classList.remove("show"); setTimeout(()=>wrap.remove(),200); };
  const dot=()=>wrap.querySelector(".fp-sbtn .sdot").classList.toggle("show",!!q.trim());
  inp.oninput=()=>{ q=inp.value; clr.classList.toggle("show",!!q); dot(); draw(); };
  let downOnBack=false;
  wrap.onpointerdown=e=>{ downOnBack=e.target===wrap; };
  wrap.onclick=(e)=>{
    if(e.target===wrap){ if(downOnBack) close(); downOnBack=false; return; }   /* 点遮罩 = 取消（§45，第四轮推翻第二轮的判断） */
    const r=e.target.closest("[data-f]");
    if(r){ const id=r.dataset.f, st=cur[id];
      cur[id]= st==="all" ? "none" : st==="none" ? (init[id]==="some"?"some":"all") : "all";   /* 半选 → 全选 → 不选 → 半选（仅初始为半选时） */
      draw(); return; }
    const b=e.target.closest("[data-x]"); if(!b) return;
    const x=b.dataset.x;
    if(x==="s"){ searchOpen=!searchOpen; wrap.querySelector(".fpk").classList.toggle("searching",searchOpen); b.classList.toggle("on",searchOpen); b.setAttribute("aria-expanded",String(searchOpen));
      if(searchOpen) setTimeout(()=>inp.focus(),60); else inp.blur();   /* 收起保留关键词与筛选结果（§41） */
      return; }
    if(x==="clr"){ inp.value=""; q=""; clr.classList.remove("show"); dot(); draw(); inp.focus(); return; }
    if(x==="new"){ dialog({title:"新建文件夹", input:{value:"", placeholder:"文件夹名称"}, ok:"创建", onOk:(v)=>{
        if(!v.trim()) return "名称不能为空";
        const f={id:"f"+Date.now(),n:v.trim(),c:0,s:[]}; FOLDERS.unshift(f); init[f.id]="none"; cur[f.id]="all"; draw(); list.scrollTop=0;
      }}); return; }
    if(x==="c"){ close(); return; }
    if(x==="o"){
      let added=0, removed=0;
      FOLDERS.forEach(f=>{
        const a=init[f.id], b2=cur[f.id]; if(a===b2) return;
        if(b2==="all"){ let k=0; ids.forEach(id=>{ const m=memOf(id); if(!m.has(f.id)){ m.add(f.id); k++; const it=findItem(id); if(it&&it.seed&&!it.doc) f.s=[it.seed,...f.s.filter(x=>x!==it.seed)].slice(0,3); } }); if(k){ added++; syncFolderCount(f.id); } }
        else if(b2==="none"){ let k=0; ids.forEach(id=>{ const m=memOf(id); if(m.has(f.id)){ m.delete(f.id); k++; if(f.id===S.folder) FD_OUT.add(S.folder+"/"+id); } }); if(k){ removed++; syncFolderCount(f.id); } }
      });
      close();
      if(!added&&!removed){ return; }
      S.select=false; S.sel=new Set(); render();
      /* C-01：已将 M 项加入 N 个文件夹；仅移除时「已从 N 个文件夹移出」 */
      toast(added&&!removed?`已将 ${n} 项加入 ${added} 个文件夹`:!added?`已从 ${removed} 个文件夹移出`:`已将 ${n} 项加入 ${added} 个文件夹，并从 ${removed} 个移出`);
    }
  };
  return wrap;
}
/* ===== 通用进度弹窗（§44）：上传 / 导入大视频、下载解密、导出等耗时操作必须复用 =====
   const pg=progressDialog({title:"正在导出…", total:M, onCancel});
   pg.set({index:n(1 起), name:"文件名", pct:0–100})；pg.done({title:"导出完成", text:"已导出 M 项"})；pg.fail(text)；pg.close() */
function progressDialog(opts){
  const layer=document.getElementById("layer");
  const wrap=document.createElement("div");
  wrap.className="dlg-back pg-back";
  wrap.innerHTML=`<div class="dlg pgd" role="dialog" aria-modal="true" aria-labelledby="pg-t">
    <div class="pg-ic" aria-hidden="true"><i class="spin"></i>${ic("tick")}</div>
    <h4 id="pg-t">${esc(opts.title||"正在处理…")}</h4>
    <p class="pg-file" aria-live="polite">&nbsp;</p>
    <div class="pg-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
    <div class="pg-meta"><span class="pg-n"></span><span class="pg-pct">0%</span></div>
    <div class="dbtns one"><button type="button" data-x="c">${esc(opts.cancel||"取消")}</button></div></div>`;
  layer.appendChild(wrap);
  requestAnimationFrame(()=>requestAnimationFrame(()=>wrap.classList.add("show")));
  const $=sel=>wrap.querySelector(sel);
  let closed=false;
  const api={
    set({index,name,pct}){
      if(closed) return;
      const p=Math.max(0,Math.min(100,pct||0));
      if(name!=null) $(".pg-file").textContent=name;
      if(index!=null&&opts.total) $(".pg-n").textContent=`第 ${index} / ${opts.total} 项`;
      $(".pg-pct").textContent=Math.floor(p)+"%";
      $(".pg-bar i").style.transform=`scaleX(${p/100})`;
      $(".pg-bar").setAttribute("aria-valuenow",String(Math.floor(p)));
    },
    done({title,text,hold}={}){
      if(closed) return;
      api.set({pct:100});
      wrap.querySelector(".pgd").classList.add("is-done");
      $("#pg-t").textContent=title||"已完成"; $(".pg-file").textContent=text||"";
      $(".pg-n").textContent=""; 
      setTimeout(api.close, hold||1100);
    },
    fail(text){ if(closed) return; wrap.querySelector(".pgd").classList.add("is-fail"); $("#pg-t").textContent="未完成"; $(".pg-file").textContent=text||""; setTimeout(api.close,1400); },
    close(){ if(closed) return; closed=true; wrap.classList.remove("show"); setTimeout(()=>wrap.remove(),240); }
  };
  wrap.onclick=e=>{ const b=e.target.closest("[data-x]"); if(b&&!closed){ opts.onCancel&&opts.onCancel(); api.close(); } };
  return api;
}
/* 演示：多选栏「导出」——假进度（每项按假文件大小耗时 0.7–1.6s） */
function demoExport(){
  const ids=[...S.sel], items=ids.map(id=>findItem(id)||{name:id}).map(it=>({name:it.name+(it.doc?".txt":it.video?".mp4":".jpg"),w:it.video?1600:it.doc?700:1000}));
  const total=items.length, sum=items.reduce((a,b)=>a+b.w,0);
  let cancelled=false, done=0, k=0, t0=performance.now();
  const pg=progressDialog({title:"正在导出…", total, onCancel:()=>{ cancelled=true; toast("已取消导出"); }});
  const tick=()=>{
    if(cancelled) return;
    const now=performance.now(), el=now-t0, it=items[k];
    const frac=Math.min(1,el/it.w);
    pg.set({index:k+1, name:it.name, pct:(done+frac*it.w)/sum*100});
    if(frac>=1){ done+=it.w; k++; t0=now; if(k>=total){ pg.done({title:"导出完成", text:`已导出 ${total} 项`}); return; } }
    setTimeout(tick,120);
  };
  setTimeout(tick,200);
}

const PLYR_I18N={restart:"重新播放",rewind:"后退 {seektime} 秒",play:"播放",pause:"暂停",fastForward:"快进 {seektime} 秒",seek:"跳转",seekLabel:"{currentTime} / {duration}",played:"已播放",buffered:"已缓冲",currentTime:"当前时间",duration:"时长",volume:"音量",mute:"静音",unmute:"取消静音",enterFullscreen:"全屏",exitFullscreen:"退出全屏",settings:"设置",menuBack:"返回上一级",speed:"播放速度",normal:"正常",quality:"画质",loop:"循环",start:"开始",end:"结束",all:"全部",reset:"重置",disabled:"关闭",enabled:"开启"};
/* 视频播放页：Plyr。正式应用中 src 为解密后 Blob 的 object URL（URL.createObjectURL），关闭时 revoke。 */
function openVideo(it){

  layer.appendChild(v);

  if(window.Plyr){
    player=new Plyr(video,{
      controls:["play-large","rewind","play","fast-forward","progress","current-time","duration","mute","volume","settings","fullscreen"],
      settings:["speed"], speed:{selected:1,options:[0.5,0.75,1,1.25,1.5,2]}, seekTime:10,

  const stage=v.querySelector(".vstage");

  const bubble=side=>{ const b=v.querySelector(".vseek."+side); b.classList.add("show"); clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove("show"),500); };
  stage.addEventListener("pointerup",e=>{
    if(e.target.closest(".plyr__controls,.plyr__menu__container,.plyr__control--overlaid")) return;
    const side=sideOf(e.clientX), now=Date.now();
    if(side&&side===lastSide&&now-last<300){
      const d=side==="l"?-10:10;
      video.currentTime=Math.max(0,Math.min((video.duration||0),video.currentTime+d));
      bubble(side); last=0; lastSide=""; return;
    }
    last=now; lastSide=side;
  },true);
  stage.addEventListener("dblclick",e=>{ if(sideOf(e.clientX)) e.stopPropagation(); },true);
  const close=()=>{ try{ player&&player.destroy(); }catch(_){} v.remove(); };
  v.addEventListener("click",(e)=>{
    const b=e.target.closest("[data-x]");
    if(!b) return;
    if(b.dataset.x==="back"){ close(); return; }
    if(b.dataset.x==="ren"){
      const {base,ext}=splitName(it.name);
      prompt2("重命名", base, ext||".mp4", (val)=>{
        if(!val.trim()) return "名称不能为空";
        it.name=val.trim()+(ext||".mp4");
        v.querySelector(".vbar b").textContent=it.name;
        toast("已重命名");
        return true;
      });
    }
  });
  return v;
}

  if(!it||it.doc){ toast(it?("文档："+it.name):"无法打开"); return; }
