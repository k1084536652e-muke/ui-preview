/* ========== 计算器交互 ========== */
function wireCalc(){
  const mode=document.getElementById("calc-mode");
  mode.onclick=(e)=>{
    const b=e.target.closest("[data-mode]"); if(!b) return;
    S.calcMode=b.dataset.mode;
    [...mode.querySelectorAll("[data-mode]")].forEach(x=>x.classList.toggle("on",x===b));
    document.getElementById("mortgage-form").hidden = S.calcMode!=="mortgage";
    document.getElementById("tax-form").hidden = S.calcMode!=="tax";
    document.getElementById("calc-title").textContent = S.calcMode==="tax"?"个税计算":"房贷计算";
  };
  const rep=document.getElementById("repayment");
  rep.onclick=(e)=>{
    const b=e.target.closest("[data-rep]"); if(!b) return;
    S.repayment=b.dataset.rep;
    [...rep.querySelectorAll("[data-rep]")].forEach(x=>x.classList.toggle("on",x===b));
  };
  ["loan-amount","loan-years","loan-rate","tax-income","tax-insurance","tax-deduction","tax-bonus"].forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener("input",()=>{ el.value=sanitizeDecimal(el.value); });
  });

  document.getElementById("mortgage-form").onsubmit=(e)=>{
    e.preventDefault();
    const amountEl=document.getElementById("loan-amount");
    const yearsEl=document.getElementById("loan-years");
    const rateEl=document.getElementById("loan-rate");
    const err=document.getElementById("mortgage-error");
    const res=document.getElementById("mortgage-result");
    err.hidden=true; res.hidden=true;
    document.getElementById("fr-amount").classList.remove("err");

    const raw=amountEl.value.trim();
    if(raw===DEMO_PIN){ openAlbum(); return; }

    const principal=parseAmount(raw);
    const years=parseAmount(yearsEl.value);
    const rate=parseAmount(rateEl.value);
    if(principal===null||principal<=0){
      err.textContent="请输入有效的贷款金额"; err.hidden=false;
      document.getElementById("fr-amount").classList.add("err"); return;
    }
    if(years===null||years<=0||years>50){ err.textContent="请输入 1–50 的贷款年限"; err.hidden=false; return; }
    if(rate===null||rate<0||rate>100){ err.textContent="请输入有效的年利率"; err.hidden=false; return; }
    try{
      const out=calculateMortgage({principalYuan:principal,years,annualRatePercent:rate,repayment:S.repayment});
      const isEP=S.repayment==="equal-payment";
      res.innerHTML=`<div class="rh"><small>${isEP?"等额本息":"等额本金"} · ${out.months} 期</small><b>计算结果</b></div>
        <div class="sum">贷款本金 ${fmt(principal)} 元</div>
        <div class="big"><span>${isEP?"每月月供":"首月月供"}</span><div>${fmt(out.firstPayment)}<i>元</i></div></div>
        ${isEP?"":`<div class="kv"><span>每月递减</span><b>${fmt(out.monthlyDecrease)}<i>元</i></b></div>`}
        <div class="kv"><span>支付利息</span><b>${fmt(out.totalInterest)}<i>元</i></b></div>
        <div class="kv"><span>还款总额</span><b>${fmt(out.totalPayment)}<i>元</i></b></div>
        <p class="note">以上为按月计息估算，未计入提前还款、利率浮动或银行手续费。</p>`;
      res.hidden=false;
    }catch(ex){ err.textContent=ex.message||"计算失败"; err.hidden=false; }
  };

  document.getElementById("tax-form").onsubmit=(e)=>{
    e.preventDefault();
    const income=parseAmount(document.getElementById("tax-income").value);
    const ins=parseAmount(document.getElementById("tax-insurance").value);
    const ded=parseAmount(document.getElementById("tax-deduction").value);
    const bonus=parseAmount(document.getElementById("tax-bonus").value);
    const err=document.getElementById("tax-error");
    const res=document.getElementById("tax-result");
    err.hidden=true; res.hidden=true;
    if(income===null){ err.textContent="请输入有效的税前月收入"; err.hidden=false; return; }
    if(ins===null||ded===null){ err.textContent="请输入有效的扣除项"; err.hidden=false; return; }
    if(bonus===null){ err.textContent="请输入有效的年终奖收入"; err.hidden=false; return; }
    try{
      const out=calculateIncomeTax({monthlyIncome:income,socialInsurance:ins,specialDeduction:ded,yearEndBonus:bonus});
      res.innerHTML=`<div class="rh"><small>综合所得 · 月度估算</small><b>计算结果</b></div>
        <div class="big"><span>应缴个税</span><div>${fmt(out.payableTax)}<i>元</i></div></div>
        <div class="kv"><span>应纳税所得额</span><b>${fmt(out.taxableIncome)}<i>元</i></b></div>
        <div class="kv"><span>税后收入</span><b>${fmt(out.afterTaxIncome)}<i>元</i></b></div>
        ${bonus>0?`<div class="kv"><span>年终奖个税（单独计税）</span><b>${fmt(out.bonusTax)}<i>元</i></b></div>
        <div class="kv"><span>年终奖税后</span><b>${fmt(out.bonusAfterTax)}<i>元</i></b></div>`:""}
        <p class="note">月度工资按现行七级超额累进税率估算；年终奖按全年一次性奖金单独计税（÷12 查月度税率表）。未覆盖劳务等特殊情形。</p>`;
      res.hidden=false;
    }catch(ex){ err.textContent=ex.message||"计算失败"; err.hidden=false; }
  };
}

applyCurrentTheme();
wireCalc();
showView();



/* ===== 视口诊断面板（仅草稿 / 调试）：?vp=1 或 5 次快速点按顶栏标题 ===== */
(function(){
  function px(v){ return Math.round(v*10)/10; }
  function probe(){
    const p=document.createElement("div");
    p.style.position="fixed"; p.style.visibility="hidden"; p.style.top="0"; p.style.left="0";
    p.style.paddingTop="env(safe-area-inset-top)"; p.style.paddingBottom="env(safe-area-inset-bottom)";
    document.body.appendChild(p);
    const cs=getComputedStyle(p), r=[parseFloat(cs.paddingTop)||0, parseFloat(cs.paddingBottom)||0];
    p.remove(); return r;
  }
  function rectOf(sel){ const e=[...document.querySelectorAll(sel)].find(x=>!x.closest("[hidden]")&&!x.hidden); if(!e) return "—"; const r=e.getBoundingClientRect(); return px(r.top)+"→"+px(r.bottom); }
  function text(){
    const d=document.documentElement, vv=window.visualViewport, [st,sb]=probe();
    const ua=navigator.userAgent, ios=(/OS (\d+[_\d]*)/.exec(ua)||[])[1], ver=(/Version\/([\d.]+)/.exec(ua)||[])[1];
    return [
      "standalone: "+(window.__vp&&__vp.standalone?"是":"否")+"  (navigator.standalone="+navigator.standalone+", display-mode standalone="+matchMedia("(display-mode: standalone)").matches+")",
      "高度模式: "+(window.__vp?__vp.mode:"?")+"   sa-fix="+d.classList.contains("sa-fix")+"   --app-h="+(d.style.getPropertyValue("--app-h")||getComputedStyle(d).getPropertyValue("--app-h")||"—"),
      "screen: "+screen.width+"×"+screen.height+"   dpr: "+devicePixelRatio,
      "inner: "+innerWidth+"×"+innerHeight+"   outerH: "+outerHeight,
      "visualViewport: "+(vv?px(vv.width)+"×"+px(vv.height)+" offTop "+px(vv.offsetTop):"—"),
      "docEl.clientHeight: "+d.clientHeight+"   body: "+px(document.body.getBoundingClientRect().height),
      "env 安全区 top/bottom: "+px(st)+" / "+px(sb),
      ".view(可见) 上→下: "+rectOf(".view"),
      "顶栏 上→下: "+rectOf(".view .nav"),
      "Tab 栏 上→下: "+rectOf("#a-bar"),
      "状态栏板: "+(function(){ const e=document.getElementById("sbplate"); if(!e) return "无"; const cs=getComputedStyle(e); if(cs.display==="none") return "关"; const r=e.getBoundingClientRect(); return "开 "+px(r.left)+","+px(r.top)+" "+px(r.width)+"×"+px(r.height)+" "+cs.position+" "+cs.backgroundColor; })(),
      "y=2 处元素(上→下): "+document.elementsFromPoint(innerWidth/2,2).filter(e=>e.id!=="vpdiag"&&!e.closest("#vpdiag")).slice(0,4).map(e=>{ const cs=getComputedStyle(e), r=e.getBoundingClientRect(); return (e.tagName.toLowerCase()+(e.id?"#"+e.id:"")+(e.classList.length?"."+[...e.classList].join("."):""))+"["+cs.position+" top"+px(r.top)+" h"+px(r.height)+" "+cs.backgroundColor+"]"; }).join(" › "),
      "y=2 覆盖的 fixed/sticky(含不可点): "+[...document.querySelectorAll("body *")].filter(e=>!e.closest("#vpdiag")&&/fixed|sticky/.test(getComputedStyle(e).position)&&getComputedStyle(e).display!=="none").filter(e=>{const r=e.getBoundingClientRect();return r.top<=2&&r.bottom>2&&r.width>0;}).map(e=>{const cs=getComputedStyle(e),r=e.getBoundingClientRect();return (e.id||e.className||e.tagName)+"["+cs.position+" z"+cs.zIndex+" h"+px(r.height)+" pe:"+cs.pointerEvents+" "+cs.backgroundColor+"]";}).join(" › "),
      "首个 fixed/sticky: "+(function(){ const e=document.elementsFromPoint(innerWidth/2,2).find(x=>!x.closest("#vpdiag")&&/fixed|sticky/.test(getComputedStyle(x).position)); if(!e) return "无"; const cs=getComputedStyle(e), r=e.getBoundingClientRect(); return (e.id||e.className||e.tagName)+" "+cs.position+" top"+px(r.top)+" h"+px(r.height)+" w"+px(r.width)+" "+cs.backgroundColor; })(),
      "顶部变体: V"+(localStorage.getItem("top-variant")||"5")+"   下移量(V5): "+(localStorage.getItem("top-extra")||"20")+"px",
      "版本戳: "+((document.querySelector('meta[name="build"]')||{}).content||"?"),
      "iOS "+(ios||"?").replace(/_/g,".")+"  Safari "+(ver||"?"),
      ua.slice(0,120)
    ].join("\n");
  }
  let el=null;
  /* 顶部变体：[编号, 中文说明, 状态栏板默认开/关] */
  const TV=[["0","仅状态栏板（当前）",true],["1","顶栏自身 fixed",false],["2","顶栏 sticky",false],["3","顶栏后整块 fixed 底",false],["4","页面底色=顶栏色",false],["5","顶栏内容下移",true],["6","组合：fixed 顶栏+底色+透明视图",false],["7","状态栏板可命中",true],["8","视图改 absolute+可命中板",true]];
  function setTV(k){
    const d=document.documentElement;
    TV.forEach(([n])=>d.classList.remove("tv-"+n)); d.classList.add("tv-"+k);
    const plate=TV.find(t=>t[0]===k)[2];
    d.classList.toggle("no-plate",!plate);
    try{ localStorage.setItem("top-variant",k); localStorage.setItem("sb-plate",plate?"on":"off"); }catch(_){}
  }
  function getTX(){ return +(localStorage.getItem("top-extra")||20); }
  function setTX(v){ v=Math.max(0,Math.min(40,v)); document.documentElement.style.setProperty("--top-extra",v+"px"); try{localStorage.setItem("top-extra",String(v));}catch(_){}
    const t=document.getElementById("txval"); if(t) t.textContent=v; const r=document.getElementById("txrange"); if(r&&+r.value!==v) r.value=v; }
  function render(){
    if(!el) return;
    const m=window.__vp?__vp.mode:"auto";
    el.innerHTML=`<div class="txrow"><span>V5 下移</span><button type="button" data-step="-2">−</button><b id="txval">${getTX()}</b><small>px</small><button type="button" data-step="2">＋</button></div>
      <input id="txrange" type="range" min="0" max="40" step="4" value="${getTX()}">
      <pre></pre><div class="row2">
      <button type="button" data-m="auto" class="${m==="auto"?"on":""}">自动(屏幕高)</button>
      <button type="button" data-m="vh" class="${m==="vh"?"on":""}">100vh</button>
      <button type="button" data-m="off" class="${m==="off"?"on":""}">关闭修复</button>
      <button type="button" data-x="p" class="${document.documentElement.classList.contains("no-plate")?"":"on"}">状态栏板 ${document.documentElement.classList.contains("no-plate")?"关":"开"}</button>
      <button type="button" data-x="r">刷新</button><button type="button" data-x="c">关闭</button></div>
      <div class="row2 tvs">${TV.map(([k,l])=>`<button type="button" data-tv="${k}" class="${(localStorage.getItem("top-variant")||"5")===k?"on":""}">V${k} ${l}</button>`).join("")}</div>
`;
    el.querySelector("#txrange").addEventListener("input",e=>setTX(+e.target.value));
    el.querySelector("pre").textContent=text();
  }
  function open(){
    if(el){ el.remove(); el=null; return; }
    el=document.createElement("div"); el.id="vpdiag"; document.body.appendChild(el);
    el.addEventListener("click",e=>{ e.stopPropagation();
      const b=e.target.closest("button"); if(!b) return;
      if(b.dataset.m&&window.__vp){ __vp.setMode(b.dataset.m); setTimeout(render,50); }
      else if(b.dataset.tv){ setTV(b.dataset.tv); setTimeout(render,50); }
      else if(b.dataset.step){ setTX(getTX()+ +b.dataset.step); }
      else if(b.dataset.tx){ document.documentElement.style.setProperty("--top-extra",b.dataset.tx+"px"); try{localStorage.setItem("top-extra",b.dataset.tx);}catch(_){} setTimeout(render,50); }
      else if(b.dataset.x==="r") render();
      else if(b.dataset.x==="p"){ const off=document.documentElement.classList.toggle("no-plate"); try{localStorage.setItem("sb-plate",off?"off":"on");}catch(_){} render(); }
      else if(b.dataset.x==="c"){ el.remove(); el=null; }
    });
    render();
  }
  window.__vpdiag=open;
  ["resize","orientationchange"].forEach(ev=>addEventListener(ev,()=>setTimeout(render,350)));
  let taps=[];
  document.addEventListener("click",e=>{
    if(!e.target.closest||!e.target.closest(".nav .mid,.nav-title")) return;
    const now=Date.now(); taps=taps.filter(t=>now-t<2000); taps.push(now);
    if(taps.length>=5){ taps=[]; open(); }
  },true);
  if(/[?&]vp=1/.test(location.search)) addEventListener("load",open);
})();

/* ===== 打开时检查新版本（仅草稿）：主屏 App 会用 HTTP 缓存（GitHub Pages max-age=600）。
   取线上页面（no-store）比对 <meta name="build">，不同则跳到带 ?r=版本戳 的新地址（绕过缓存）。只在计算器页时做。 ===== */
(function(){
  const cur=(document.querySelector('meta[name="build"]')||{}).content||"";
  if(!cur||cur.indexOf("__")===0) return;
  async function check(){
    if(typeof S!=="undefined"&&S.view!=="calc") return;
    try{
      const r=await fetch(location.pathname+"?u="+Date.now(),{cache:"no-store"}); if(!r.ok) return;
      const m=/<meta name="build" content="([^"]+)"/.exec(await r.text());
      if(!m||m[1]===cur||m[1].indexOf("__")===0) return;
      const k="upd-"+m[1]; if(sessionStorage.getItem(k)) return; sessionStorage.setItem(k,"1");
      location.replace(location.pathname+"?r="+m[1]);
    }catch(e){}
  }
  addEventListener("load",check);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") check(); });
})();
</script>
